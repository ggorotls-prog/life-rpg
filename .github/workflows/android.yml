# 라이프 RPG 앱 APK를 GitHub가 만든다(2026-11-11, 업무 기록·카톡 기록 앱과 같은 방식). 컴퓨터에 설치할 것 없음.
# android/ 를 고쳐 올리면 자동으로, 또는 Actions 탭에서 「Run workflow」로 만든다.
# 2026-11-15 룡: 건강 기록(life-room)·재정 기록(faith-budget)의 폰 기능 원본(healthkit·finkit)이 바뀌면 RPG 새 버전도 저절로.
#   15분마다 그 두 폴더의 마지막 바뀜(커밋)을 보고, 지난번 RPG가 쓴 판(app/kits.json)과 다르면 만든다. 비밀값·토큰이 필요 없다.
#   웹 화면(index.html)은 앱이 주소로 띄우므로 바뀌면 다시 만들 필요 없이 바로 보인다.
name: android-apk

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '원본이 바뀌었을 때만 만들기(15분 점검과 같게)'
        type: boolean
        default: false
      work_ref:
        description: '업무 기록 원본(greenjui-calls)의 가지(시험용, 보통 main)'
        type: string
        default: 'main'
      spirit_ref:
        description: '영성 기록 원본(personal-record)의 가지(시험용, 보통 main)'
        type: string
        default: 'main'
      rel_ref:
        description: '관계 기록 원본(relation-record)의 가지(시험용, 보통 main)'
        type: string
        default: 'main'

jobs:
  # 원본(healthkit·finkit)이 지난번 RPG 판과 달라졌나. push·그냥 Run workflow는 늘 만든다
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_WORK_KEY: ${{ secrets.KIT_WORK_KEY }}
          KIT_SPIRIT_KEY: ${{ secrets.KIT_SPIRIT_KEY }}
        run: |
          H=$(gh api "repos/ggorotls-prog/life-room/commits?path=android/healthkit&per_page=1" -q '.[0].sha')
          F=$(gh api "repos/ggorotls-prog/faith-budget/commits?path=android/finkit&per_page=1" -q '.[0].sha')
          L=$(gh api "repos/ggorotls-prog/relation-record/commits?path=android/relkit&per_page=1" -q '.[0].sha')
          # 업무 기록 저장소(greenjui-calls)는 비공개라 읽기 전용 열쇠(배포 키)로 본다
          W=""
          if [ -n "$KIT_WORK_KEY" ]; then
            echo "$KIT_WORK_KEY" > "$RUNNER_TEMP/work.key"; chmod 600 "$RUNNER_TEMP/work.key"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/work.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone -q --filter=blob:none --no-checkout git@github.com:ggorotls-prog/greenjui-calls.git "$RUNNER_TEMP/w" && W=$(git -C "$RUNNER_TEMP/w" log -1 --format=%H origin/main -- android/workkit)
            rm -f "$RUNNER_TEMP/work.key"
          fi
          # 영성 기록 저장소(personal-record)도 비공개라 읽기 전용 열쇠로
          P=""
          if [ -n "$KIT_SPIRIT_KEY" ]; then
            echo "$KIT_SPIRIT_KEY" > "$RUNNER_TEMP/spirit.key"; chmod 600 "$RUNNER_TEMP/spirit.key"
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/spirit.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone -q --filter=blob:none --no-checkout git@github.com:ggorotls-prog/personal-record.git "$RUNNER_TEMP/p" && P=$(git -C "$RUNNER_TEMP/p" log -1 --format=%H origin/main -- android/spiritkit)
            rm -f "$RUNNER_TEMP/spirit.key"
          fi
          echo "원본 지금: healthkit $H · finkit $F · workkit $W · spiritkit $P · relkit $L"
          if [ "${{ github.event_name }}" = "push" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" != "true" ]; }; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          OLD=$(gh api "repos/${{ github.repository }}/contents/app/kits.json" -q .content 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
          echo "지난번 RPG 판: $OLD"
          if [ -n "$H" ] && [ -n "$F" ] && [ -n "$W" ] && [ -n "$P" ] && [ -n "$L" ] && echo "$OLD" | grep -q "$H" && echo "$OLD" | grep -q "$F" && echo "$OLD" | grep -q "$W" && echo "$OLD" | grep -q "$P" && echo "$OLD" | grep -q "$L"; then echo "그대로라 안 만들어요"; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "원본이 바뀌어 새로 만들어요"; echo "go=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    outputs:
      healthkit: ${{ steps.kits.outputs.healthkit }}
      finkit: ${{ steps.kits.outputs.finkit }}
      workkit: ${{ steps.kits.outputs.workkit }}
      spiritkit: ${{ steps.kits.outputs.spiritkit }}
      relkit: ${{ steps.kits.outputs.relkit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # 열쇠는 고정(기록 앱 공용 record). 없으면 멈춘다: 새 열쇠로 만들면 폰에 덮어 깔 수 없다.
      - name: 서명 열쇠 꺼내기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "GitHub Secrets에 KEYSTORE_B64가 없어요"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/record.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/record.p12" >> "$GITHUB_ENV"
      # 기록 앱 폰 기능 원본 한 벌(2026-11-15 룡 「하나로 모으자」): 그 기록 앱 저장소를 받아 그 폴더를 그대로 쓴다(복사본 없음).
      # 🏠 집 = 건강 기록(life-room) android/healthkit · 👛 지갑 = 재정 기록(faith-budget) android/finkit. 받은 판 번호를 기록에 남긴다
      - name: 기록 앱 원본 받기
        id: kits
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_WORK_KEY: ${{ secrets.KIT_WORK_KEY }}
          WORK_REF: ${{ inputs.work_ref || 'main' }}
          KIT_SPIRIT_KEY: ${{ secrets.KIT_SPIRIT_KEY }}
          SPIRIT_REF: ${{ inputs.spirit_ref || 'main' }}
          REL_REF: ${{ inputs.rel_ref || 'main' }}
        run: |
          echo "healthkit=$(gh api "repos/ggorotls-prog/life-room/commits?path=android/healthkit&per_page=1" -q '.[0].sha')" >> "$GITHUB_OUTPUT"
          echo "finkit=$(gh api "repos/ggorotls-prog/faith-budget/commits?path=android/finkit&per_page=1" -q '.[0].sha')" >> "$GITHUB_OUTPUT"
          git clone -q --depth 1 https://github.com/ggorotls-prog/life-room.git android/ext/life-room
          git clone -q --depth 1 https://github.com/ggorotls-prog/faith-budget.git android/ext/faith-budget
          echo "건강 기록 원본: $(git -C android/ext/life-room rev-parse --short HEAD)"
          echo "재정 기록 원본: $(git -C android/ext/faith-budget rev-parse --short HEAD)"
          # 📋 업무 기록(greenjui-calls) workkit: 비공개라 읽기 전용 열쇠(배포 키, 비밀값 KIT_WORK_KEY)로 받는다. 없으면 멈춘다
          if [ -z "$KIT_WORK_KEY" ]; then echo "GitHub Secrets에 KIT_WORK_KEY(업무 기록 읽기 전용 열쇠)가 없어요"; exit 1; fi
          echo "$KIT_WORK_KEY" > "$RUNNER_TEMP/work.key"; chmod 600 "$RUNNER_TEMP/work.key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/work.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone -q --filter=blob:none -b "$WORK_REF" git@github.com:ggorotls-prog/greenjui-calls.git android/ext/greenjui-calls
          rm -f "$RUNNER_TEMP/work.key"
          echo "workkit=$(git -C android/ext/greenjui-calls log -1 --format=%H -- android/workkit)" >> "$GITHUB_OUTPUT"
          echo "업무 기록 원본: $WORK_REF $(git -C android/ext/greenjui-calls rev-parse --short HEAD)"
          # ⛪ 영성 기록(personal-record) spiritkit: 비공개라 읽기 전용 열쇠(비밀값 KIT_SPIRIT_KEY)
          if [ -z "$KIT_SPIRIT_KEY" ]; then echo "GitHub Secrets에 KIT_SPIRIT_KEY(영성 기록 읽기 전용 열쇠)가 없어요"; exit 1; fi
          echo "$KIT_SPIRIT_KEY" > "$RUNNER_TEMP/spirit.key"; chmod 600 "$RUNNER_TEMP/spirit.key"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/spirit.key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone -q --filter=blob:none -b "$SPIRIT_REF" git@github.com:ggorotls-prog/personal-record.git android/ext/personal-record
          rm -f "$RUNNER_TEMP/spirit.key"
          echo "spiritkit=$(git -C android/ext/personal-record log -1 --format=%H -- android/spiritkit)" >> "$GITHUB_OUTPUT"
          echo "영성 기록 원본: $SPIRIT_REF $(git -C android/ext/personal-record rev-parse --short HEAD)"
          # 👥 관계 기록(relation-record, 공개) relkit
          git clone -q --filter=blob:none -b "$REL_REF" https://github.com/ggorotls-prog/relation-record.git android/ext/relation-record
          echo "relkit=$(git -C android/ext/relation-record log -1 --format=%H -- android/relkit)" >> "$GITHUB_OUTPUT"
          echo "관계 기록 원본: $REL_REF $(git -C android/ext/relation-record rev-parse --short HEAD)"
      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: gradle -p android assembleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: life-rpg-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      # 시험용(가상 폰에서 잠금 상태를 직접 넣어 보려고). 사이트에는 안 올린다
      - uses: actions/upload-artifact@v4
        with:
          name: life-rpg-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # 가상 안드로이드 폰에 깔아서 실제로 켜 본다. 켜자마자 꺼지면 오류 기록을 남기고 실패로 표시한다.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: life-rpg-apk
      - uses: actions/download-artifact@v4
        with:
          name: life-rpg-debug
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 15
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash ====="; cat crash.txt
            if grep -q "FATAL EXCEPTION" crash.txt; then exit 1; fi
            adb shell pidof app.liferpg || { echo "앱이 꺼져 있어요"; exit 1; }
            echo "앱이 켜져 있어요"
            adb exec-out screencap -p > shot-light.png || true
            adb shell cmd uimode night yes || true
            adb shell am force-stop app.liferpg
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 6
            adb exec-out screencap -p > shot-dark.png || true
            adb shell cmd uimode night no || true
            # 알림 권한 켜고 다시 켜 보기(알람·위젯 등록이 꺼지지 않는지)
            adb shell pm grant app.liferpg android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 8
            adb shell am broadcast -a app.liferpg.DAILY -n app.liferpg/.Daily || true
            sleep 6
            adb logcat -d -b crash > crash2.txt || true
            echo "===== crash (알림 시험) ====="; cat crash2.txt
            if grep -q "FATAL EXCEPTION" crash2.txt; then exit 1; fi
            adb exec-out screencap -p > shot-perm.png || true
            # 인터넷을 끄고 켜 봐도 꺼지지 않는지
            adb shell svc wifi disable; adb shell svc data disable; adb shell cmd connectivity airplane-mode enable || true
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 10
            adb logcat -d -b crash > crash3.txt || true
            echo "===== crash (인터넷 끔) ====="; cat crash3.txt
            if grep -q "FATAL EXCEPTION" crash3.txt; then exit 1; fi
            # 비행기 모드를 켜면 가상 폰의 구글 서비스가 죽고, 그걸 쓰는 WebView 앱도 같이 정리된다(우리 오류 아님, 2026-11-11 8번). 그래서 여기도 오류(FATAL)만 본다
            adb logcat -d | grep -E "Killing [0-9]+:app.liferpg" || true
            echo "인터넷 꺼도 앱이 켜져 있어요"
            adb shell cmd connectivity airplane-mode disable || true; adb shell svc wifi enable; adb shell svc data enable
            sleep 8
            # ---- 🏠 집 = 건강 기록 화면 + 취침 잠금(2026-11-15). 건강 기록 앱 시험과 같은 것 ----
            # ① 위젯 🏠 버튼과 같은 길(open=home)로 열면 건강 기록 화면(HealthActivity)이 뜬다
            adb logcat -c
            adb shell am force-stop app.liferpg
            adb shell am start -W -n app.liferpg/.MainActivity --es open home
            sleep 15
            adb logcat -d -b crash > crash4.txt || true
            echo "===== crash (집) ====="; cat crash4.txt
            if grep -q "FATAL EXCEPTION" crash4.txt; then exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" | tee top1.txt
            grep -q "app.liferpg/.HealthActivity" top1.txt || { echo "건강 기록 화면이 안 떴어요"; exit 1; }
            echo "🏠 집 → 건강 기록 화면 뜸"
            adb exec-out screencap -p > shot-home.png || true
            adb shell dumpsys alarm | grep -c "app.liferpg" || true
            # ② 취침 잠금 서비스가 폰과 이어지는지(건강 기록 앱 시험과 같음)
            adb shell settings put secure enabled_accessibility_services app.liferpg/app.liferpg.LockService
            adb shell settings put secure accessibility_enabled 1
            sleep 5
            adb shell dumpsys accessibility > acc.txt || true
            grep "Bound services" acc.txt | grep -q "라이프 RPG 취침 잠금" || { grep -i -E "liferpg|Bound services" acc.txt || true; echo "잠금 서비스가 안 이어졌어요"; exit 1; }
            echo "잠금 서비스 이어짐"
            # ③ 「잘게요」로 잠긴 상태(시험판에 잠금 시각을 넣는다) → 다른 앱(설정)을 열면 덮개가 덮고 건강 기록 화면으로 끌려온다
            adb shell settings delete secure enabled_accessibility_services || true
            adb uninstall app.liferpg
            adb install -r app-debug.apk
            adb shell pm grant app.liferpg android.permission.POST_NOTIFICATIONS || true
            NOW="$(adb shell date +%s | tr -d '\r')000"; printf '<?xml version="1.0" encoding="utf-8" standalone="yes" ?>\n<map>\n    <long name="locked_at" value="%s" />\n    <boolean name="acc_asked" value="true" />\n</map>\n' "$NOW" > life.xml; cat life.xml
            adb push life.xml /data/local/tmp/life.xml
            adb shell chmod 644 /data/local/tmp/life.xml
            adb shell run-as app.liferpg mkdir -p shared_prefs
            adb shell run-as app.liferpg cp /data/local/tmp/life.xml shared_prefs/life.xml
            adb shell run-as app.liferpg cat shared_prefs/life.xml
            adb shell settings put secure enabled_accessibility_services app.liferpg/app.liferpg.LockService
            adb shell settings put secure accessibility_enabled 1
            sleep 6
            adb logcat -c
            adb shell am start -W -a android.settings.SETTINGS
            sleep 6
            adb exec-out screencap -p > shot-locked.png || true
            adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" | tee top2.txt
            adb shell dumpsys window windows | grep -i -E "AccessibilityOverlay|ACCESSIBILITY_OVERLAY|liferpg" | head -20 || true
            grep -q "app.liferpg/.HealthActivity" top2.txt || { echo "잠겼는데 설정 앱이 열려 있어요"; exit 1; }
            echo "잠금 확인: 설정을 열어도 건강 기록 화면으로 돌아옴"
            # ④ 잠긴 채로 마을(라이프 RPG 첫 화면)을 열어도 건강 기록 화면으로
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" | tee top3.txt
            grep -q "app.liferpg/.HealthActivity" top3.txt || { echo "잠겼는데 마을이 열려 있어요"; exit 1; }
            echo "잠긴 채 마을을 열어도 건강 기록 화면"
            adb logcat -d -b crash > crash5.txt || true
            if grep -q "FATAL EXCEPTION" crash5.txt; then cat crash5.txt; exit 1; fi
            # ---- 👛 지갑 = 재정 기록(2026-11-15 2단계) ----
            adb shell settings delete secure enabled_accessibility_services || true
            adb uninstall app.liferpg
            adb install -r app-release.apk
            adb shell pm grant app.liferpg android.permission.POST_NOTIFICATIONS || true
            # ⑤ 위젯 👛 버튼과 같은 창: 빠른 기록 창(재정 위젯 − 지출과 같은 창)
            adb logcat -c
            adb shell am start -W -n app.liferpg/.WalletQuickActivity --es kind out
            sleep 12
            adb logcat -d -b crash > crash6.txt || true
            if grep -q "FATAL EXCEPTION" crash6.txt; then cat crash6.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top4.txt
            grep -q "app.liferpg/.WalletQuickActivity" top4.txt || { echo "지갑 빠른 기록 창이 안 떴어요"; exit 1; }
            echo "👛 지갑 → 빠른 기록 창 뜸"
            adb exec-out screencap -p > shot-wallet-quick.png || true
            adb shell input keyevent KEYCODE_BACK
            # ⑥ 마을 「📒 재정 장부 전체」와 같은 길(open=ledger): 재정 기록 화면 그 자체
            adb shell am force-stop app.liferpg
            adb shell am start -W -n app.liferpg/.MainActivity --es open ledger
            sleep 15
            adb logcat -d -b crash > crash7.txt || true
            if grep -q "FATAL EXCEPTION" crash7.txt; then cat crash7.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top5.txt
            grep -q "app.liferpg/.WalletActivity" top5.txt || { echo "재정 장부 화면이 안 떴어요"; exit 1; }
            echo "📒 장부 → 재정 기록 화면 뜸"
            adb exec-out screencap -p > shot-wallet.png || true
            # ⑦ 「+ 수입 | − 지출」 위젯이 이 앱에 들어 있는지
            adb shell dumpsys appwidget | grep -E "app.liferpg/.WalletWidget" | head -3 || true
            adb shell cmd package query-receivers --components -a android.appwidget.action.APPWIDGET_UPDATE | grep -E "liferpg" | tee rcv.txt || true
            grep -q "WalletWidget" rcv.txt || { echo "재정 위젯이 안 들어 있어요"; exit 1; }
            echo "재정 위젯 들어 있음"
            # ---- 📋 업무 기록(2026-11-16): 업무 기록 앱 시험과 같은 것 ----
            # ⑧ 요청·확인과 같은 길(open=work): 업무 기록 화면 그 자체
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity --es open work
            sleep 15
            adb logcat -d -b crash > crash8.txt || true
            if grep -q "FATAL EXCEPTION" crash8.txt; then cat crash8.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top6.txt
            grep -q 'WorkApp\$Screen' top6.txt || { echo "업무 기록 화면이 안 떴어요"; exit 1; }
            echo "📋 업무 기록 화면 뜸"
            adb exec-out screencap -p > shot-work.png || true
            # ⑨ ＋ 할 일 적기 작은 창(업무 기록 위젯 ＋와 같은 창)
            adb logcat -c
            adb shell am start -W -n 'app.liferpg/.WorkApp$Quick'
            sleep 6
            adb logcat -d -b crash > crash9.txt || true
            if grep -q "FATAL EXCEPTION" crash9.txt; then cat crash9.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top7.txt
            # 업무 기록 로그인 전에는 적기 창이 업무 기록 화면(로그인)으로 넘긴다(업무 기록 앱과 같음)
            grep -qE 'WorkApp\$(Quick|Screen)' top7.txt || { echo "할 일 적기 창도 업무 기록 화면도 안 떴어요"; exit 1; }
            echo "＋ 할 일 적기 창 → (로그인 전이면) 업무 기록 화면"
            adb exec-out screencap -p > shot-work-quick.png || true
            adb shell input keyevent KEYCODE_BACK
            # ⑩ 업무 기록 위젯 둘(내 할 일 · 오늘 일정·할 일)
            grep -q 'WorkApp\$TaskWidget' rcv.txt || { echo "내 할 일 위젯이 없어요"; exit 1; }
            grep -q 'WorkApp\$CalWidget' rcv.txt || { echo "오늘 일정 위젯이 없어요"; exit 1; }
            echo "업무 기록 위젯 둘 들어 있음"
            # ⑪ 15분 확인이 걸렸는지(업무 기록 알림)
            adb shell dumpsys jobscheduler | grep -c 'WorkApp\$Sync' || true
            # ---- ⛪ 영성 기록(2026-11-16): 영성 기록 앱 시험과 같은 것 ----
            # ⑫ 아빠 집 묵상과 같은 길(open=spirit): 영성 기록 화면 그 자체
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity --es open spirit
            sleep 15
            adb logcat -d -b crash > crash10.txt || true
            if grep -q "FATAL EXCEPTION" crash10.txt; then cat crash10.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top8.txt
            grep -q 'SpiritApp\$Screen' top8.txt || { echo "영성 기록 화면이 안 떴어요"; exit 1; }
            echo "⛪ 영성 기록 화면 뜸"
            adb exec-out screencap -p > shot-spirit.png || true
            # ⑬ SOC 적기 창(영성 기록 위젯·바로가기와 같은 창). 로그인 전이면 영성 기록 화면으로 넘어간다
            adb logcat -c
            adb shell am start -W -n 'app.liferpg/.SpiritApp$Quick' --es kind SOC
            sleep 6
            adb logcat -d -b crash > crash11.txt || true
            if grep -q "FATAL EXCEPTION" crash11.txt; then cat crash11.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top9.txt
            grep -qE 'SpiritApp\$(Quick|Screen)' top9.txt || { echo "SOC 적기 창도 영성 기록 화면도 안 떴어요"; exit 1; }
            echo "SOC 적기 창 길 OK"
            adb shell input keyevent KEYCODE_BACK
            # ⑭ 영성 기록 위젯
            grep -q 'SpiritApp\$Widget' rcv.txt || { echo "영성 기록 위젯이 없어요"; exit 1; }
            echo "영성 기록 위젯 들어 있음"
            # ---- 👥 관계 기록(2026-11-16): 관계 기록 앱 시험과 같은 것 ----
            # ⑮ 마을 「이웃」과 같은 길(open=rel): 관계 기록 화면 그 자체(화면 글은 relkit 안 assets/rel/index.html)
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity --es open rel
            sleep 15
            adb logcat -d -b crash > crash12.txt || true
            if grep -q "FATAL EXCEPTION" crash12.txt; then cat crash12.txt; exit 1; fi
            adb shell dumpsys activity activities | grep -E "topResumedActivity" | tee top10.txt
            grep -q 'RelApp\$Screen' top10.txt || { echo "관계 기록 화면이 안 떴어요"; exit 1; }
            adb logcat -d | grep -E "ERR_FILE_NOT_FOUND" | head -3 | tee asset.txt || true
            if grep -q "ERR_FILE_NOT_FOUND" asset.txt; then echo "관계 기록 화면 글을 못 찾았어요"; exit 1; fi
            echo "👥 관계 기록 화면 뜸"
            adb exec-out screencap -p > shot-rel.png || true
            # ⑯ 통화가 끝났을 때 받는 곳(PHONE_STATE)이 이 앱에 들어 있는지
            adb shell cmd package query-receivers --components -a android.intent.action.PHONE_STATE | grep liferpg | tee phone.txt || true
            grep -q 'RelApp\$Call' phone.txt || { echo "통화 받기가 안 들어 있어요"; exit 1; }
            echo "통화 받기 들어 있음"
      # 화면 사진(밝은·어두운): 모양 확인용
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shot-*.png

  # main에서 만들고 가상 폰 확인까지 통과하면, APK를 사이트(app/)에 올린다.
  # 폰의 앱이 app/version.json을 보고 새 버전이면 스스로 받아서 업데이트한다. (플레이 스토어 없이 0원)
  publish:
    needs: [build, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: life-rpg-apk
          path: dist
      - name: 사이트에 올리기
        run: |
          mkdir -p app
          cp dist/app-release.apk app/life-rpg.apk
          SHA=$(sha256sum app/life-rpg.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"apk":"/app/life-rpg.apk","sha256":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SHA" > app/version.json
          # 이 판이 쓴 기록 앱 원본(15분 점검이 이것과 비교한다)
          printf '{"healthkit":"%s","finkit":"%s","workkit":"%s","spiritkit":"%s","relkit":"%s"}\n' "${{ needs.build.outputs.healthkit }}" "${{ needs.build.outputs.finkit }}" "${{ needs.build.outputs.workkit }}" "${{ needs.build.outputs.spiritkit }}" "${{ needs.build.outputs.relkit }}" > app/kits.json
          git config user.name "life-rpg-bot"
          git config user.email "life-rpg-bot@users.noreply.github.com"
          git add -f app
          git commit -m "앱 새 버전 올림 (${GITHUB_RUN_NUMBER})"
          git pull --rebase -q origin main
          git push origin HEAD:main
