# 라이프 RPG 앱 APK를 GitHub가 만든다(2026-11-11, 업무 기록·카톡 기록 앱과 같은 방식). 컴퓨터에 설치할 것 없음.
# android/ 를 고쳐 올리면 자동으로, 또는 Actions 탭에서 「Run workflow」로 만든다.
name: android-apk

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # 열쇠는 고정(기록 앱 공용 record). 없으면 멈춘다: 새 열쇠로 만들면 폰에 덮어 깔 수 없다.
      - name: 서명 열쇠 꺼내기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "GitHub Secrets에 KEYSTORE_B64가 없어요"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/record.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/record.p12" >> "$GITHUB_ENV"
      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: life-rpg-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # 가상 안드로이드 폰에 깔아서 실제로 켜 본다. 켜자마자 꺼지면 오류 기록을 남기고 실패로 표시한다.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: life-rpg-apk
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 15
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash ====="; cat crash.txt
            if grep -q "FATAL EXCEPTION" crash.txt; then exit 1; fi
            adb shell pidof app.liferpg || { echo "앱이 꺼져 있어요"; exit 1; }
            echo "앱이 켜져 있어요"
            adb exec-out screencap -p > shot-light.png || true
            adb shell cmd uimode night yes || true
            adb shell am force-stop app.liferpg
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 6
            adb exec-out screencap -p > shot-dark.png || true
            adb shell cmd uimode night no || true
            # 알림 권한 켜고 다시 켜 보기(알람·위젯 등록이 꺼지지 않는지)
            adb shell pm grant app.liferpg android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 8
            adb shell am broadcast -a app.liferpg.DAILY -n app.liferpg/.Daily || true
            sleep 6
            adb logcat -d -b crash > crash2.txt || true
            echo "===== crash (알림 시험) ====="; cat crash2.txt
            if grep -q "FATAL EXCEPTION" crash2.txt; then exit 1; fi
            adb exec-out screencap -p > shot-perm.png || true
            # 인터넷을 끄고 켜 봐도 꺼지지 않는지
            adb shell svc wifi disable; adb shell svc data disable; adb shell cmd connectivity airplane-mode enable || true
            adb shell am force-stop app.liferpg
            adb logcat -c
            adb shell am start -W -n app.liferpg/.MainActivity
            sleep 10
            adb logcat -d -b crash > crash3.txt || true
            echo "===== crash (인터넷 끔) ====="; cat crash3.txt
            if grep -q "FATAL EXCEPTION" crash3.txt; then exit 1; fi
            # 비행기 모드를 켜면 가상 폰의 구글 서비스가 죽고, 그걸 쓰는 WebView 앱도 같이 정리된다(우리 오류 아님, 2026-11-11 8번). 그래서 여기도 오류(FATAL)만 본다
            adb logcat -d | grep -E "Killing [0-9]+:app.liferpg" || true
            echo "인터넷 꺼도 앱이 켜져 있어요"
      # 화면 사진(밝은·어두운): 모양 확인용
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shot-*.png

  # main에서 만들고 가상 폰 확인까지 통과하면, APK를 사이트(app/)에 올린다.
  # 폰의 앱이 app/version.json을 보고 새 버전이면 스스로 받아서 업데이트한다. (플레이 스토어 없이 0원)
  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: life-rpg-apk
          path: dist
      - name: 사이트에 올리기
        run: |
          mkdir -p app
          cp dist/app-release.apk app/life-rpg.apk
          SHA=$(sha256sum app/life-rpg.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"apk":"/app/life-rpg.apk","sha256":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SHA" > app/version.json
          git config user.name "life-rpg-bot"
          git config user.email "life-rpg-bot@users.noreply.github.com"
          git add -f app
          git commit -m "앱 새 버전 올림 (${GITHUB_RUN_NUMBER})"
          git pull --rebase -q origin main
          git push origin HEAD:main
