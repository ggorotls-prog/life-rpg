<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이프 RPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1f1d;--mute:#6b6a64;--line:#e4e2db;--brand:#3b5b8c;--brand2:#e8eef7;--ok:#2f7d5b;--gray:#b9b7af}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:14px 14px 40px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.mute{color:var(--mute)}.small{font-size:13px}
.bar{height:8px;background:#eeece6;border-radius:5px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .6s}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--brand2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none}
.lv{font-size:28px;font-weight:700;color:var(--brand)}
.stat{display:grid;grid-template-columns:42px 1fr 64px;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.stat .n{text-align:right;color:var(--mute);font-size:13px}
.stat.off{color:var(--gray)}.stat.off .bar>i{background:#ddd}
.today li{list-style:none;padding:7px 0;border-bottom:1px solid #f0eee8;display:flex;gap:8px;font-size:14px}
.today li:last-child{border:0}.today ul{margin:0;padding:0}
.today .xp{margin-left:auto;color:var(--ok);font-weight:600}
.today .not{color:var(--gray)}
.pill{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.banner{background:#eef6f1;color:#245c43;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
button{font:inherit;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:12px 16px;width:100%;font-weight:600}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.err{color:#b33;font-size:13px;min-height:18px}
.cons{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;line-height:1.45}
.cons input,.chip input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--brand)}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:6px 10px;font-size:14px;background:#fff}
details summary{cursor:pointer;color:var(--brand)}
.crow{display:flex;align-items:flex-start;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .cons{flex:1;margin:0}
.crow .see{font-size:13px;color:var(--mute);white-space:nowrap;padding-top:1px;text-decoration:underline}
.tg{font-size:12px;color:var(--mute);font-weight:700}.tg.req{color:var(--brand)}
.sum{display:block;font-size:13px;color:var(--mute);margin-top:2px}.sum b{color:var(--ink)}
.doc{position:fixed;inset:0;background:var(--bg);z-index:12;display:flex;flex-direction:column}
.doc .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff}
.doc .dh .x{width:auto;background:transparent;color:var(--mute);padding:4px 8px;font-size:18px}
.doc .db{flex:1;overflow:auto;padding:8px 16px 24px;font-size:14px;line-height:1.7}
.doc .db h4{margin:16px 0 2px;font-size:14px}.doc .db ul{margin:0;padding-left:20px}.doc .db p{margin:10px 0}
.doc .df{padding:10px 16px 18px;border-top:1px solid var(--line);background:#fff}
button:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:24px}
.ov .card{width:100%;max-width:360px;text-align:center}
.big{font-size:44px;font-weight:800;color:var(--brand);margin:6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f1f1d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:10;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
svg text{font-family:inherit}
.foot{text-align:center;font-size:12px;color:var(--gray);margin-top:14px}
body.tabs{padding-bottom:84px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
.nav b{flex:1;text-align:center;padding:12px 0 14px;font-size:14px;color:var(--mute);font-weight:600}
.nav b.on{color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mini .lv{font-size:22px}
.town{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;position:relative;min-height:138px}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:44px;line-height:1.1}
.tile .nm{font-weight:700;margin-top:6px;font-size:16px}
.tile .st{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.4}
.tile .got{position:absolute;top:8px;right:8px;background:#eef6f1;color:var(--ok);font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.sheet h3{margin:0 0 12px;font-size:18px}
.faces{display:flex;gap:10px}.faces button{font-size:30px;background:#fff;border:1px solid var(--line);padding:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{background:#fff;color:var(--mute);border:1px solid var(--line);padding:9px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
select{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
.task{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.task .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--brand);flex:none;background:#fff}
.task .tt{flex:1;font-size:14px}
.town3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile.sm{min-height:0;padding:10px 6px}.tile.sm .ic{font-size:30px}.tile.sm .nm{font-size:14px;margin-top:2px}.tile.sm .st{font-size:11px}
.today2 .trow{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #f0eee8;font-size:14px}
.today2 .trow:last-child{border:0}
.today2 .tm{width:40px;flex:none;color:var(--mute);font-size:12px;padding-top:2px}
.today2 .tx{flex:1;min-width:0;word-break:keep-all}
.today2 .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--brand);background:#fff;padding:0;flex:none}
.today2 .evbar{width:4px;align-self:stretch;background:#3b6fb6;border-radius:2px;flex:none}
.today2 .faded{color:#9a9890}.today2 .faded .evbar{background:#cfcdc5}
.today2 .red{color:#d62d1c!important}
.today2 .thead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#2f5d50;padding:10px 0 4px}
.today2 .thead.warn{color:#b26a00}
.today2 .perm{color:#2f5d50;display:block}
.bk{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #eeece6;font-size:14px}
.bk .okc{color:var(--ok);font-weight:600}
.chs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px 0 10px}
.chs b{text-align:center;padding:8px 0;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:500}
.chs b.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tbar{display:flex;gap:6px;margin:0 0 6px}
.tbar b{flex:1;text-align:center;background:#f3f2ee;border-radius:8px;padding:7px 0;font-size:12px;color:var(--brand)}
.tbar b.warn{color:#b26a00}.tbar b.ok{color:#2f5d50}
.nowline{display:flex;align-items:center;gap:6px;color:#d62d1c;font-size:11px;font-weight:700;margin:2px 0}
.nowline::after{content:"";flex:1;height:1px;background:#d62d1c}
.reward{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-size:34px;font-weight:800;color:var(--ok);z-index:12;pointer-events:none;animation:rw 1.4s ease-out forwards}
@keyframes rw{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
/* 마을 = 게임 화면(2026-11-16 룡): 1층 마을 그림 · 2층 건물 이름표 · 3층 위 Lv·다음 일정 2개 / 아래 퀘스트·상점·오늘 */
#world{position:fixed;left:50%;top:50%;width:max(100vw,50vh);height:max(200vw,100vh);transform:translate(-50%,-50%);z-index:0}
#world svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.spot .hit{margin:0 auto}
/* 이름표는 건물 그림 바로 아래(2026-11-19 룡 「건물이랑 안 겹치게, 너무 내리지 말고」). 누르는 칸 = 건물 사각형 */
.spot.tag{transform:translateX(-50%)}.spot.tag .lb{margin-top:0}
.bhit{position:absolute;cursor:pointer}
.spot .lb{display:inline-block;margin-top:2px;background:rgba(255,255,255,.93);border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}
.spot .lb small{display:block;font-weight:500;color:var(--mute);font-size:11px}
/* 건물 옆 말풍선 버튼(2026-11-18 룡 「말풍선이나 건물 옆에 띄우는 버튼으로 가볍게」): 생각났을 때 바로 적는 길 */
.spot .lbw{position:relative;display:inline-block}
/* 말풍선은 늘 건물 그림 오른쪽 위(약간 걸치게), 꼬리가 건물을 가리킨다(2026-11-18 룡 「항상 건물그림 오른쪽 위, 꼭 말풍선처럼」) */
.bub{position:absolute;transform:translate(-14px,-100%);display:flex;gap:6px;padding:5px;background:#fff;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
.bub::after{content:'';position:absolute;left:var(--t,14px);bottom:-9px;border:6px solid transparent;border-top:10px solid #fff;border-bottom:0;filter:drop-shadow(0 2px 1px rgba(0,0,0,.12))}
.bub b{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:20px;background:#f4f6fa;font-size:22px;font-weight:800;color:var(--brand);line-height:1}
.bub b.out{color:#1F6F54}.bub b.in{color:#1B62B5}
.bub.l{transform:translate(calc(-100% + 14px),-100%)}.bub.l::after{left:auto;right:var(--t,14px)}
.spot .lb .warn{color:#c8553d;font-weight:700}
/* 마을 건물에는 ✓를 안 띄운다(2026-11-16 룡 「아예 체크를 없애줘, 굳이?」). 이름표 아래 작은 글(오늘 한 것)만 */
.me{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);font-size:44px;animation:bob 2.4s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translate(-50%,-56%)}}
.hud{position:fixed;left:12px;right:12px;z-index:2;max-width:496px;margin:0 auto}
.hud.top{top:calc(10px + env(safe-area-inset-top))}
.hud.bot{bottom:52px;display:flex;gap:10px}
.glass{background:rgba(255,255,255,.95);border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:8px 12px;margin-bottom:8px}
.glass.lvb{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.glass.lvb b{color:var(--brand);font-size:18px}
.glass.evs{padding:4px 12px}
.evl{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;font-weight:600}
.evl+.evl{border-top:1px solid #eeece6}
.evl .tt{color:var(--brand);font-size:12px;font-weight:700;white-space:nowrap;min-width:84px}
.evl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evl.now .tt{color:#d62d1c}
/* 일정 줄 🎙 = 녹음 알림 걸기(2026-11-19 룡 「일정에서 미리, 본인이 직접」). 건 것은 진하게 */
.mic{font-size:15px;padding:3px 7px;border-radius:12px;opacity:.6;filter:grayscale(1);flex:none;cursor:pointer}.mic.on{opacity:1;filter:none;background:#fde7e3;color:#c8553d;font-weight:800}
.mlen{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.mlen b{flex:1 0 28%;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-weight:700;cursor:pointer}.mlen b.on{background:var(--ink,#1f1f1d);color:#fff;border-color:transparent}
.mtime{display:flex;gap:10px;margin:10px 0}.mtime label{flex:1;font-size:13px;color:var(--mute)}.mtime input{width:100%;font:inherit;font-size:18px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-top:4px}
.act{flex:1;border:0;border-radius:16px;padding:10px 0 8px;font:inherit;font-weight:800;font-size:15px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);width:auto}
.act small{display:block;font-weight:500;font-size:11px;opacity:.9}
.act.q{background:#d9822b}.act.s{background:#3b5b8c}.act.c{background:#fff;color:var(--ink)}
</style>
</head>
<body>
<div id="town"></div>
<div id="app"><div class="card mute">불러오는 중…</div></div>
<div class="nav" id="nav" style="display:none"><b id="t-town" onclick="tab('town')">🏘️ 마을</b><b id="t-app" onclick="tab('app')">📊 상태창</b></div>
<div id="toast" class="toast"></div>
<script>
// ===== 규칙 (설계안 2판, 2026-11-12 룡 컨펌) =====
// 단위 하나: 영역마다 기록한 날 하루 = 10. 재정·관계는 하루 25, 한 주 70까지(주 3일이면 가득).
// 영역 레벨: 다음 레벨까지 10 × (지금 레벨 + 1). 누적 = 5L² + 5L − 10.
// 캐릭터 레벨 = (영역 레벨 합 + 가장 낮은 영역 × 2) ÷ (영역 수 + 2). 고르게 클수록 빨리 오름.
// 한 번 닿은 레벨은 내려가지 않음(서버 rpg_players.peaks). 벌칙·끊김 표시 없음.
const AREAS = ['일','관계','재정','건강','지성','영성'];
const WEEKLY = {'재정':1,'관계':1};
const READY = {'지성':'지성 기록이 생기면 시작돼요'}; // 아직 수집 통로가 없는 영역
const BADGE_DAYS = [10,30,100,200,365,500,1000,2000,3650];
const SEASON0 = '2026-11-09'; // 첫 시즌 시작(월), 13주씩

// ===== 날짜 =====
const D = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const S = t => new Date(t).toISOString().slice(0,10);
const add = (s,n) => S(D(s)+n*864e5);
const monday = s => { const w = (new Date(D(s)).getUTCDay()+6)%7; return add(s,-w); };
const md = s => (+s.slice(5,7))+'/'+(+s.slice(8,10));

// ===== 서버 =====
const KEY = 'sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj', SB = 'https://trlnatdkebjvgiqneulv.supabase.co';
const cbs = {}; let cbN = 0;
window.__rpc = (cb, status, body) => { const f = cbs[cb]; delete cbs[cb]; f && f(status, body); };
function rpc(fn, args){
  return new Promise((ok, no) => {
    const done = (st, body) => { let j = null; try { j = JSON.parse(body); } catch(e){}
      if (st >= 200 && st < 300) ok(j); else no({status:st, body:j}); };
    if (window.Native) { const id = 'c'+(++cbN); cbs[id] = done; Native.rpc(fn, JSON.stringify(args||{}), id); }
    else fetch(SB+'/rest/v1/rpc/'+fn, {method:'POST', headers:{apikey:KEY,'Content-Type':'application/json'}, body:JSON.stringify(args||{})})
      .then(r => r.text().then(t => done(r.status, t))).catch(() => done(0, ''));
  });
}
const token = () => window.Native ? Native.token() : (localStorage.getItem('rpg_token')||'');
const setToken = t => window.Native ? Native.setToken(t) : localStorage.setItem('rpg_token', t);
const ls = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
             set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 오류 글(2026-11-17): 무엇을 하면 되는지까지 말한다. 서버 영어 오류는 그대로 보여 주지 않는다
const AGAIN = ' 다시 눌러 주세요. 계속 안 되면 관리자에게 말해 주세요.';
function errMsg(e){
  if (!e || !e.status) return '인터넷이 안 돼요. 연결을 확인하고' + AGAIN;
  const b = e.body || {}, m = String(b.message || '');
  if (b.code === 'PGRST202' || e.status === 404) return '아직 준비 중인 기능이에요. 관리자에게 말해 주세요.';
  if (m === 'auth') return '로그인이 풀렸어요. 다시 들어가 주세요.';
  if (m.startsWith('pack: ')) return m.slice(6) + '. ⚙ 설정에서 확인해 주세요.';
  return '잘 안 됐어요.' + AGAIN;
}

// ===== 계산 =====
const cum = L => 5*L*L + 5*L - 10;
function levelOf(xp){ let L = 1; while (cum(L+1) <= xp) L++; const need = 10*(L+1), into = xp - cum(L); return {L, into, need, f: L + into/need}; }

// 연 기록만 계산·화면에 넣는다(2026-11-17): 영역 → 확장팩. 지성은 확장팩이 없어 기록이 있을 때만
const PACK_OF = {'일':'업무','관계':'관계','재정':'재정','건강':'건강','영성':'영성'};
const opened = a => !PACK_OF[a] || has(PACK_OF[a]);
function compute(data){
  const today = data.today, byArea = {};
  AREAS.forEach(a => byArea[a] = {}); // 날짜 → {항목: 개수}
  for (const [d,a,i,n] of data.rows) { if (!byArea[a]) continue; (byArea[a][d] = byArea[a][d] || {})[i] = n; }
  const wk0 = monday(today), m28 = add(today,-27), p28 = add(today,-55);
  const res = {today, areas:{}};
  for (const a of AREAS) {
    const days = Object.keys(byArea[a]).sort();
    const r = {a, days, open: opened(a), ready: opened(a) && (!READY[a] || days.length > 0)};
    let xp = 0, todayXp = 0;
    if (WEEKLY[a]) {
      const wk = {}; days.forEach(d => { const k = monday(d); wk[k] = (wk[k]||0) + 1; });
      for (const k in wk) xp += Math.min(70, 25*wk[k]);
      if (byArea[a][today]) { const n = wk[wk0]||0; todayXp = Math.min(70,25*n) - Math.min(70,25*(n-1)); }
    } else { xp = 10*days.length; if (byArea[a][today]) todayXp = 10; }
    r.xp = xp; r.todayXp = todayXp; r.lv = levelOf(xp);
    r.week = days.filter(d => d >= wk0).length;
    r.d28 = days.filter(d => d >= m28).length;
    r.p28 = days.filter(d => d >= p28 && d < m28).length;
    r.shape = WEEKLY[a] ? Math.min(1, r.d28/12) : r.d28/28;
    r.todayItems = byArea[a][today] || null;
    r.total = days.length;
    r.next = BADGE_DAYS.find(b => b > r.total) || null;
    r.prevB = [...BADGE_DAYS].reverse().find(b => b <= r.total) || 0;
    res.areas[a] = r;
  }
  const act = AREAS.filter(a => res.areas[a].ready);
  const fs = act.map(a => res.areas[a].lv.f), mn = fs.length ? Math.min(...fs) : 0;   // 연 기록이 아직 없으면 0
  res.char = fs.length ? (fs.reduce((x,y) => x+y, 0) + 2*mn) / (act.length + 2) : 1;
  res.minArea = act.length > 1 ? act.reduce((m,a) => res.areas[a].lv.f < res.areas[m].lv.f ? a : m, act[0]) : null;
  res.todayXp = act.reduce((s,a) => s + res.areas[a].todayXp, 0);
  res.totalXp = act.reduce((s,a) => s + res.areas[a].xp, 0);
  // 고른 주: 그 주(월~일)에 시작된 영역이 모두 한 번 이상
  const season = Math.floor((D(today) - D(SEASON0)) / (91*864e5));
  const sStart = add(SEASON0, season*91);
  res.season = season + 1; res.seasonStart = sStart; res.seasonEnd = add(sStart, 90);
  let bal = 0, balNow = false;
  for (let w = sStart; w <= today; w = add(w,7)) {
    const ok = act.length && act.every(a => res.areas[a].days.some(d => d >= w && d < add(w,7)));
    if (ok) { bal++; if (w === wk0) balNow = true; }
  }
  res.balWeeks = bal; res.balNow = balNow;
  res.weekIdx = Math.floor((D(today) - D(sStart)) / (7*864e5)) + 1;
  return res;
}

// 한 번 닿은 값은 안 내려감
function applyPeaks(res, peaks){
  peaks = peaks || {};
  res.charShown = Math.max(res.char, +peaks.char || 0);
  for (const a of AREAS) { const r = res.areas[a]; r.lvShown = Math.max(r.lv.L, +peaks[a] || 0); }
  const out = {char: +res.char.toFixed(3)};
  AREAS.forEach(a => out[a] = res.areas[a].lv.L);
  return out;
}

const ITEM = {'할 일 끝냄':'할 일 끝냄','기상':'기상','취침':'취침','운동':'운동','식단':'식단','오운완':'오운완','묵상':'묵상','SOC':'SOC','감사':'감사','칭찬':'칭찬','순종':'순종','깨달음':'깨달음','일기':'일기','가정 장부':'가정 장부','기업 장부':'기업 장부','통화':'통화','메모':'메모','카톡 1:1':'카톡 1:1'};
function itemsText(it){ return Object.entries(it).map(([k,n]) => (ITEM[k]||k) + (n > 1 ? ' '+n : '')).join(' · '); }

function radar(res){
  const act = AREAS.filter(a => res.areas[a].open), cx = 110, cy = 105, R = 78;
  const pt = (i, r) => { const t = -Math.PI/2 + i*2*Math.PI/act.length; return [cx + r*Math.cos(t), cy + r*Math.sin(t)]; };
  const ring = k => act.map((_,i) => pt(i, R*k).join(',')).join(' ');
  const shape = act.map((a,i) => pt(i, R*Math.max(.04, res.areas[a].ready ? res.areas[a].shape : 0)).join(',')).join(' ');
  const labels = act.map((a,i) => { const [x,y] = pt(i, R+16); return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="${res.areas[a].ready?'#6b6a64':'#b9b7af'}">${a}</text>`; }).join('');
  return `<svg viewBox="0 0 220 210" width="100%" style="max-width:280px;display:block;margin:0 auto">
    ${[.33,.66,1].map(k => `<polygon points="${ring(k)}" fill="none" stroke="#e4e2db"/>`).join('')}
    <polygon points="${shape}" fill="rgba(59,91,140,.18)" stroke="#3b5b8c" stroke-width="2"/>${labels}</svg>`;
}

        <div class="row" style="margin-top:6px"><div class="bar"><i style="width:${Math.round(cp*100)}%"></i></div><span class="small mute">${Math.round(cp*100)}%</span></div></div></div>
      <div class="small mute" style="margin-top:10px">고르게 기를수록 빨리 올라요${res.minArea ? ` · 지금 가장 작은 칸: <b>${res.minArea}</b>` : ''}</div>
    </div>
    <div class="card today"><h2>오늘 나아간 것 <span class="small" style="float:right">+${res.todayXp} EXP</span></h2><ul>${todayList}</ul></div>

    <div class="card"><h2>최근 4주 모양</h2>${AREAS.filter(a => res.areas[a].open).length >= 3 ? radar(res) : ''}<div style="margin-top:8px">${cmp}</div>
      <div class="small mute" style="margin-top:6px">▲▽ = 그 전 4주와 비교한 기록한 날</div></div>
    <div class="card"><h2>시즌 ${res.season} · ${res.weekIdx}/13주 <span class="small" style="float:right">${md(res.seasonStart)}~${md(res.seasonEnd)}</span></h2>
      <div class="small">고른 주(모든 칸 한 번 이상): <b>${res.balWeeks}주</b>${res.balNow ? ' · 이번 주 ✓' : ''} <span class="mute">· 배지 1·4·8·12주</span></div></div>

  levelUps(res, cl);

  if (window.Native && Native.setSummary) Native.setSummary(JSON.stringify({

    packs: {home: wOk('건강'), wallet: wOk('재정'), father: wOk('영성'), work: wOk('업무')} }));   // 위젯: 안 연 기록 버튼은 숨김
}

function levelUps(res, cl){
  const seen = ls.get('rpg_seen', null), now = {char: cl};
  AREAS.forEach(a => now[a] = res.areas[a].lvShown);
  ls.set('rpg_seen', now);
  if (!seen) return;
  if (cl > (seen.char||0)) {
    const o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = `<div class="card"><div class="mute">레벨 업</div><div class="big">Lv ${cl}</div><div class="small mute">여러 칸을 고르게 기른 만큼 올랐어요</div><button style="margin-top:14px">좋아요</button></div>`;
    o.onclick = () => o.remove(); document.body.appendChild(o); return;
  }
  const up = AREAS.filter(a => res.areas[a].lvShown > (seen[a]||0));
  if (up.length) toast(up.map(a => a+' Lv '+res.areas[a].lvShown).join(' · ') + ' 올랐어요');
}

async function load(){
  if (!token()) { if (document.getElementById('sg_go')) return; return loginView(); }   // 가입 중(처리방침 보고 돌아옴)이면 적던 것 그대로

  try {
    const [data, home, gd, me] = await Promise.all([rpc('rpg_days', {p_token: token()}), rpc('rpg_home', {p_token: token()}),
      rpc('rpg_gender', {p_token: token()}).catch(() => ({failed: true})),
      rpc('rpg_me', {p_token: token()}).catch(() => null)]);
    const before = RES ? RES.totalXp : null;
    if (me && !me.error) ME = me;   // 계산 전에: 연 기록만 계산에 넣는다
    const res = compute(data), peaks = applyPeaks(res, data.peaks);
    HOME = home; if (gd && !gd.failed) GENDER = gd.gender || null;
    render(res, data);
    town(res, home);
    document.getElementById('nav').style.display = 'flex';
    document.body.classList.add('tabs');
    tab(CUR);
    if (before !== null && res.totalXp > before) reward('✓ 기록됨'); // 2026-11-16 룡: 경험치 숫자는 화면에 띄우지 않는다
    rpc('rpg_save_peaks', {p_token: token(), p_peaks: peaks}).catch(() => {});
    // 성별이 비었으면 앱을 켠 뒤 한 번만, 열린 창이 없을 때 묻는다(쓰던 창을 덮지 않게)
    // 기존 사용자: 동의 창을 먼저(쓸 기록 고르기 + 동의, 2026-11-16 법무사 「이미 쓰는 사람도 같은 동의」)
    if (ME && ME.need_consent && !ME.owner && !document.querySelector('.sheet')) { consentView(); return; }
    if (gd && !gd.failed && !GENDER && !ASKED && !document.querySelector('.sheet')) { ASKED = true; askGender(); return; }
    // 첫 로그인 뒤 한 번: 켜야 할 것(알림·캘린더·배터리·위젯)
    if (!ls.get('rpg_setup_seen', false) && !document.querySelector('.sheet')) setupView();
    else if (!document.querySelector('.sheet')) permDrop();
  } catch(e) {
    if (e && e.body && (e.body.message === 'auth' || e.body === 'auth')) { setToken(''); return loginView(); }
    if (!RES) document.getElementById('app').innerHTML = `<div class="card">불러오지 못했어요.<br>${esc(errMsg(e))}<br><br><button onclick="load()">다시</button></div>`;
    else toast('새로 못 불러왔어요. 아래로 당겨 다시 해 주세요');
  }
}

function loginView(){

  document.getElementById('nav').style.display = 'none';

  if (wait) checkWait();

    err.textContent = '';

      if (r.error) { err.textContent = r.error; return; }
      if (waitNick() && waitNick().toLowerCase() === id.trim().toLowerCase()) setWait('');   // 승인돼서 들어옴

}

// 📱 켜야 할 것(2026-11-17): 첫 로그인 뒤 한 번 뜨고, ⚙ 설정에서 다시 연다. 이 앱이 실제로 쓰는 것만
// 허락 목록은 앱(Perms)이 준다: 모두에게 필요한 것 + 내가 연 기록에 필요한 것. 꺼진 것이 있으면 그 기록을 열지 않는다(gate).
// 「한 번에 켜기」 = 꺼진 것을 차례로(묻는 창은 한꺼번에, 설정 화면은 갔다 오면 다음 것). 2026-11-18 룡 「한 방에, 안 켜면 못 쓰게」
const PERM_PACK = {업무:'📋 업무', 영성:'⛪ 영성', 건강:'🏠 건강', 재정:'👛 재정', 관계:'👥 관계'};
const myPacks = () => Object.keys(PERM_PACK).filter(has);
const perms = packs => { const N = window.Native; if (!N || !N.perms) return []; try { return JSON.parse(N.perms((packs || myPacks()).join(','))); } catch(e) { return []; } };
// gate: 그 기록을 처음 열 때, 그 기록에 필요한 것이 꺼져 있으면 「켜야 할 것」을 먼저 띄운다(다 켜면 그 기록이 바로 열린다).
// 「안 켜고 쓰기」를 고르면 그 기록은 다시 묻지 않는다(「켜야 할 것」에는 꺼짐으로 남는다). 알림·배터리 같은 모두의 것으로는 막지 않는다.
// 막지 않고 고르게 한 이유: 켤 수 없는 폰이 있고, 꼭 필요하지 않은 허락을 안 켰다고 못 쓰게 하면 안 되기 때문(2026-11-18 검수)
window.gate = (pack, go) => {
  if (ls.get('rpg_gate_skip_' + pack, false)) return false;
  if (!perms([pack]).some(p => !p.on && p.pack === pack)) return false;
  setupView(pack, go); return true; };
// 켜져 있던 것이 꺼지면 그 기록을 한 번 더 안내한다(2026-11-19 룡: 단독 기록 앱을 지우자 그 앱이 켠 알림 읽기가 같이 사라져 「기록할까요?」가 안 뜸).
// 단독 앱이 깔려 있으면 그 앱이 켠 것도 켜짐으로 세므로(Perms), 단독 앱을 지우는 순간 꺼짐으로 바뀐다. 한 번만 띄우고 「안 켜고 쓰기」는 다시 고를 수 있다.
const permDrop = () => { for (const pack of myPacks()) {
  const mine = perms([pack]).filter(p => p.pack === pack); if (!mine.length) continue;
  const ok = mine.every(p => p.on), was = ls.get('rpg_perm_ok_' + pack, null);
  ls.set('rpg_perm_ok_' + pack, ok);
  if (was === true && !ok) { ls.set('rpg_gate_skip_' + pack, false); setupView(pack); return; } } };
window.gateOff = pack => { ls.set('rpg_gate_skip_' + pack, true); closeSheet(); const f = window._gateGo; window._gateGo = null; if (f) f(); };
window.setupView = (pack, go) => {
  window._gateGo = go || null;
  ls.set('rpg_setup_seen', true);
  if (!PERM_PACK[pack]) pack = '';
  const N = window.Native || {};
  const list = perms(pack ? [pack] : null), miss = list.filter(p => !p.on);
  const on = '<span class="small" style="color:var(--ok)">켜짐</span>';
  const btn = (f, t) => `<button style="width:auto;padding:4px 10px" onclick="${f}">${t}</button>`;
  const row = (title, sub, right) => `<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><div>${title}</div><div class="small mute">${sub}</div></div>${right}</div>`;
  const rows = list.map(p => row(p.title + ' <span class="small mute">[선택]</span>' + (PERM_PACK[p.pack] ? ` <span class="small mute">${PERM_PACK[p.pack]}</span>` : ''), p.why, p.on ? on : btn(`Native.permOpen('${p.id}')`, '켜기'))).join('');
  let lock = '';
  // 🏘 잠금화면 앞에 마을(2026-11-18 룡): 화면을 켜면 잠금 풀기 전에 마을이 먼저. 고르는 것이라 「한 번에 켜기」에는 안 넣는다
  if (!pack && N.lockFront) { const lf = N.lockFront(), ov = N.overlayOn();
    lock = row('🏘 잠금화면 앞에 마을 <span class="small mute">고르는 것</span>', lf && !ov ? '「다른 앱 위에 표시」를 허용해야 떠요' : '화면을 켜면 잠금 풀기 전에 마을이 먼저 보여요. 누르면 잠금을 풀어요',
      (lf && !ov ? btn('Native.openOverlay()', '허용') + ' ' : '') + (lf && N.lockNote ? btn('Native.lockNote()', '알림 숨기기') + ' ' : '') + btn(`Native.setLockFront(${!lf});closeSheet();setupView()`, lf ? '끄기' : '켜기')); }
  const head = !N.perms ? '알림·캘린더·배터리 같은 것은 앱에서만 켤 수 있어요'
    : pack ? (miss.length ? `${PERM_PACK[pack]} 기록이 제대로 돌려면 아래를 켜 주세요. 모두 선택이에요. 안 켜도 기록은 쓸 수 있고, 적힌 기능만 안 돼요.` : `${PERM_PACK[pack]} 기록에 필요한 것이 다 켜져 있어요.`)
    : miss.length ? '아래를 켜야 기록이 제대로 돌아요. 모두 선택이에요. 안 켜도 기록은 쓸 수 있고, 적힌 기능만 안 돼요.' : '다 켜져 있어요.';
  const s = sheet(`<h3>📱 켜야 할 것</h3><div class="small mute" style="margin-bottom:6px">${head}</div>
    ${miss.length ? `<button style="margin:6px 0 10px" onclick="Native.permsGo('${miss.map(p => p.id).join(',')}')">한 번에 켜기 (${miss.length}개)</button>` : ''}
    ${rows}${lock}
    ${pack ? '' : row('🧩 위젯 놓기', '홈 화면 빈 곳을 길게 누름 → 「위젯」 → 「라이프 RPG」 → 끌어다 놓기', '')}
    ${pack && go && miss.some(p => p.pack === pack)
      ? `<button class="ghost" style="margin-top:14px" onclick="gateOff('${pack}')">안 켜고 쓰기</button><div class="small mute" style="margin-top:6px">안 켜도 기록은 쓸 수 있어요. 위에 적힌 기능만 안 돼요. 나중에 ☰ → 「켜야 할 것」에서 켤 수 있어요.</div>`
      : `<button class="${miss.length ? 'ghost' : ''}" style="margin-top:14px" onclick="closeSheet();load()">${miss.length ? '나중에' : '다 했어요'}</button>`}`);
  s.id = 'setupSheet';   // 설정 화면에서 돌아오면 다시 그린다(onNative)
  s.dataset.pack = pack;
};

function nextEvents(h, n){
  const N = window.Native; if (!N || !N.calendar) return null;
  const raw = N.calendar(h.today); if (raw === null || raw === undefined) return null;
  const now = Date.now(), tag = tagOf(h.name);
  return JSON.parse(raw).filter(e => e.end > now && !others(e.title||'', tag))
    .sort((a,b) => (b.allDay?1:0) - (a.allDay?1:0) || a.begin - b.begin).slice(0, n);
}

let PLANS = {};
function loadPlans(){ try { PLANS = JSON.parse((window.Native && Native.meetPlans) ? Native.meetPlans() || '{}' : '{}'); } catch(e) { PLANS = {}; } }
function micBtn(id, begin, end, title){

}
const dayStart = ms => Math.floor((+ms + 9*3600e3) / 864e5) * 864e5 - 9*3600e3;
let MLEN = 60;
window.meetLen = (m, el) => { MLEN = m; el.parentNode.querySelectorAll('b').forEach(b => b.classList.toggle('on', b === el)); };
window.meetPick = (id, begin, end, el) => {
  const key = id + ':' + begin, p = PLANS[key], title = el.dataset.t;
  // 처음: 일정 시작 시각(이동 시간이 들어 있으니 고쳐 쓰게), 길이 60분. 걸어 둔 것이면 그 값
  MLEN = p ? Math.max(15, Math.round((p.end - p.start) / 60e3 / 15) * 15) : 60;
  const lens = [15, 30, 45, 60, 90, 120];
  if (!lens.includes(MLEN)) lens.push(MLEN);
  sheet(`<h3>🎙 언제 녹음 시작을 알려 드릴까요?</h3><div class="small mute">${esc(title)} · 일정 ${hm(+begin)}~${hm(+end)}</div>
    <div class="small mute" style="margin-top:8px">일정에는 이동 시간이 들어 있어요. 미팅이 실제로 시작하는 시각으로 고쳐 주세요.</div>
    <div class="mtime"><label>녹음 시작 알림<input type="time" id="mS" value="${hm(p ? p.start : +begin)}"></label></div>
    <div class="small mute">몇 분짜리인가요? 끝날 때 「녹음 끄세요」가 와요(더 하면 연장).</div>
    <div class="mlen">${lens.sort((a,b)=>a-b).map(m => `<b class="${m === MLEN ? 'on' : ''}" onclick="meetLen(${m}, this)">${m}분</b>`).join('')}</div>
    <button style="width:100%;margin-top:12px" onclick="meetSave('${key}','${begin}')">${p ? '바꾸기' : '이 시각에 알려 주세요'}</button>
    ${p ? `<button class="ghost" style="width:100%;margin-top:8px" onclick="meetOff('${key}')">녹음 알림 끄기</button>` : ''}`).dataset.t = title;
};
window.meetSave = (key, begin) => {
  const base = Math.max(dayStart(begin), dayStart(Date.now())); // 며칠 이어지는 일정은 오늘 기준
  const v = document.getElementById('mS').value;
  if (!v) { toast('녹음 시작 시각을 넣어 주세요'); return; }
  const [h, m] = v.split(':').map(Number);
  const st = base + h*3600e3 + (m||0)*60e3, en = st + MLEN*60e3;
  if (en <= Date.now()) { toast('이미 끝난 시각이에요'); return; }
  const title = document.querySelector('.sheet').dataset.t || '미팅';
  Native.planMeet(key, title, String(st), String(en));
  loadPlans(); closeSheet(); toast('🎙 ' + hm(st) + '에 녹음 시작을 알려 드릴게요 · ' + MLEN + '분');
  if (RES && HOME) town(RES, HOME);
};

window.addEventListener('resize', () => requestAnimationFrame(fitBubbles));   // 돌리기·화면 크기가 바뀌면 말풍선 자리(잠금 판 구멍)도 다시
function fitBubbles(){
  const W = document.getElementById('world');
  if (!W) { try { window.Native && Native.lockHole && Native.lockHole(0, 0, 0, 0, 0); } catch (e) {} return; }   // 마을이 없으면(로그인 화면) 잠금 판 구멍도 없앤다
  const wr = W.getBoundingClientRect();
  W.querySelectorAll('.spot.tag').forEach(b => {
    b.style.marginLeft = '0px';
    const r = b.getBoundingClientRect(), R = Math.min(W.getBoundingClientRect().right, window.innerWidth) - 4, L = Math.max(W.getBoundingClientRect().left, 0) + 4;
    if (r.right > R) b.style.marginLeft = (R - r.right) + 'px'; else if (r.left < L) b.style.marginLeft = (L - r.left) + 'px';
  });
  W.querySelectorAll('.bub').forEach(b => {
    b.style.marginLeft = '0px'; b.style.removeProperty('--t');
    const r = b.getBoundingClientRect(), over = r.right - (Math.min(wr.right, window.innerWidth) - 6);
    if (over > 0) { b.style.marginLeft = -over + 'px'; b.style.setProperty('--t', Math.min(14 + over, r.width - 24) + 'px'); }
    // 왼쪽 말풍선이 화면 왼쪽 밖으로 나가면 안으로(꼬리는 건물 쪽에 그대로)
    const under = Math.max(wr.left, 0) + 6 - r.left;
    if (b.classList.contains('l') && under > 0) { b.style.marginLeft = under + 'px'; b.style.setProperty('--t', Math.min(14 + under, r.width - 24) + 'px'); }
  });
  // 잠금화면 앞 마을: ＋ 수집 말풍선 자리를 앱에 알려 그 자리만 잠금 판을 뚫는다
  const N = window.Native, q = document.getElementById('qbub');
  if (N && N.lockHole) { try { if (q) { const r = q.getBoundingClientRect(); N.lockHole(r.left, r.top, r.right, r.bottom, window.innerWidth); } else N.lockHole(0, 0, 0, 0, 0); } catch (e) {} }
}
function town(res, h){
  loadPlans();
  const cl = Math.floor(res.charShown), cp = res.charShown - cl;
  const got = a => res.areas[a].todayItems ? `<span class="got">${res.areas[a].todayXp ? '+'+res.areas[a].todayXp : '✓'}</span>` : '';
  const hh = h.health;
  const homeSt = !hh ? '연결 안 됨 · 관리자에게 말해 주세요'
    : hh.need === 'bed_yesterday' ? '어젯밤 잔 시각부터'
    : hh.need === 'wake' ? '아직 안 일어남'
    : hh.bed ? `일어남 ${hh.wake} · 잠 ${hh.bed}` : `일어남 ${hh.wake} ${FACE[hh.condition]||''}`;
  const sp = h.spirit_today || [];
  const ev = nextEvents(h, 2), N = window.Native || {};
  const evHtml = ev === null
    ? (N.askCalendar ? `<div class="evl" onclick="Native.askCalendar()"><span class="nm">📅 눌러서 캘린더 보기를 허용해 주세요</span></div>` : `<div class="evl"><span class="nm mute">📅 일정은 앱에서 보여요</span></div>`)
    : ev.length ? ev.map(evLine).join('') : `<div class="evl"><span class="nm mute">📅 남은 일정 없음</span></div>`;

  const spot = (r, onc, area, name, st, up) => `<div class="bhit" style="left:${r[0]/4}%;top:${r[1]/8}%;width:${(r[2]-r[0])/4}%;height:${(r[3]-r[1])/8}%" onclick="${onc}"></div><div class="spot tag" style="left:${(r[0]+r[2])/8}%;top:${up ? (r[1]-3)/8 : (r[3]+3)/8}%${up ? ';transform:translate(-50%,-100%)' : ''}" onclick="${onc}"><div class="lbw"><div class="lb">${name}<small>${st}</small></div></div></div>`;
  // 말풍선: 늘 건물 그림 오른쪽 위 모서리(2026-11-18·19 룡 「항상 건물그림 오른쪽 위, 꼭 말풍선처럼」, 건물은 사각형).
  // (rx, ty) = 그 건물 사각형의 오른쪽 끝·윗변(마을 그림 좌표 400×800). 화면 밖으로 나가면 fitBubbles가 안으로 당긴다
  const bubble = (rx, ty, html) => `<div class="bub" style="left:${(rx - 6) / 4}%;top:${(ty + 6) / 8}%">${html}</div>`;
  // 왼쪽 위 말풍선(lx = 건물 사각형 왼쪽 끝). 사무실 ＋ 수집(2026-11-19 룡 「사무실 왼쪽에 수집추가 말풍선, 잠금화면에서도」)
  const bubbleL = (lx, ty, html, id) => `<div class="bub l"${id ? ` id="${id}"` : ''} style="left:${(lx + 6) / 4}%;top:${(ty + 6) / 8}%">${html}</div>`;

  const waitPk = ME && !ME.owner ? PACKS.filter(p => ME.packs && ME.packs[p.k] === 'requested') : [];
  const waitHtml = waitPk.length

  const todayN = (h.tasks || []).filter(t => t.requester !== h.name || (t.due && t.due <= h.today) || ((t.remind||'').slice(0,10) && (t.remind||'').slice(0,10) <= h.today)).length;
  document.getElementById('town').innerHTML = `

      ${has('업무') && N.openTodo ? spot([42, 556, 112, 630], 'Native.openTodo()', null, '사무실', '할 일') + (N.openMeet ? bubble(112, 556, meetBub(N)) : '') + (N.todoAdd ? bubbleL(42, 556, `<b onclick="Native.todoAdd()" aria-label="할 일 적기">＋</b>`, 'qbub') : '') : ''}

// ===== 오늘: 일정 + 할 일 (업무 기록 캘린더 위젯과 같은 나누기, 2026-11-12 룡 「기본 화면은 내 일정과 할 일」) =====
// 맨 위 요청받은 일 → 오늘 줄(지난 할 일 · 하루 종일 · 시간 순, 지금 줄) → 적어 둔 일(날짜 없는 내 일, 접힘)
let LOOSE_OPEN = false;
const hm = ms => { const d = new Date(ms + 9*3600e3); return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'); };
function tagOf(name){ for (const t of ['룡','월','영']) if ((name||'').includes(t)) return t; return null; }
function others(title, tag){ if (!tag) return false; const c = title.indexOf(' - '); if (c <= 0 || c > 12) return false; const w = title.slice(0,c); return !w.includes(tag) && !w.includes('가족') && !w.includes('모두'); }
function todayCard(h, res){
  const t0 = h.today, me = h.name, rows = [], asked = [], loose = [];
  let calNote = '';
  if (window.Native && Native.calendar) {
    const raw = Native.calendar(t0);
    if (raw === null || raw === undefined) calNote = `<div class="trow perm" onclick="Native.askCalendar()">📅 눌러서 캘린더 보기를 허용해 주세요<div class="small mute">허용하면 오늘 일정이 여기에 같이 보여요</div></div>`;
    else { const from = D(t0) - 9*3600e3, tag = tagOf(me);
      for (const e of JSON.parse(raw)) {
        const r = {kind:'event', title: e.title || '(제목 없음)', id: e.id, begin: e.begin, end: e.end, faded: others(e.title||'', tag)};
        if (e.allDay) { r.time = '하루'; r.sort = -1; }
        else { r.time = e.begin < from ? '이어짐' : hm(e.begin); r.sort = e.begin < from ? -1 : Math.round((e.begin - from)/60000);
               if (e.end <= from + 864e5) r.sub = '~' + hm(e.end); }
        rows.push(r);
      } }
  }
  for (const t of (has('업무') ? h.tasks : [])) {
    const due = t.due || '', remind = t.remind || '', rday = remind.slice(0,10);
    const r = {kind:'task', id: t.id, title: (t.important ? '★ ' : '') + t.title, mine: t.requester === me, company: t.company};
    if (!r.mine) { const w = due || rday; r.sub = (t.requester ? t.requester+' 요청' : '') + (w ? ' · '+md(w)+'까지' : ''); r.late = w && w < t0; asked.push(r); continue; }
    if (!due && !rday) { loose.push(r); continue; }
    const late = due && due < t0, hit = late || due === t0 || rday === t0 || (!due && rday < t0);
    if (!hit) continue;
    if (rday === t0 && remind.length >= 16) { r.time = remind.slice(11,16); r.sort = +r.time.slice(0,2)*60 + +r.time.slice(3,5); r.sub = '🔔' + (due > t0 ? ' · '+md(due)+'까지' : ''); }
    else if (late) { r.time = '지남'; r.sort = -2; r.sub = md(due)+'까지'; r.late = true; }
    else { r.time = '하루'; r.sort = -1; }
    rows.push(r);
  }
  rows.sort((a,b) => a.sort - b.sort);
  const nowMin = (() => { const d = new Date(Date.now() + 9*3600e3); return d.getUTCHours()*60 + d.getUTCMinutes(); })();
  const line = r => r.kind === 'event'
    ? `<div class="trow ev${r.faded?' faded':''}" onclick="Native.openEvent('${r.id}','${r.begin}','${r.end}')"><span class="tm">${r.time}</span><span class="evbar"></span><div class="tx">${esc(r.title)}${r.sub?`<div class="small mute">${r.sub}</div>`:''}</div>${r.faded || r.time === '하루' ? '' : micBtn(r.id, r.begin, r.end, r.title)}</div>`
    : `<div class="trow"><span class="tm${r.late?' red':''}">${r.time||''}</span><button class="ck" onclick="doneTask('${r.id}', ${r.mine})" aria-label="완료"></button><div class="tx">${esc(r.title)}${r.sub||r.company?`<div class="small ${r.late?'red':'mute'}">${[r.sub, r.company].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div></div>`;
  let body = '', placed = false; const timed = rows.some(r => r.sort >= 0);
  for (const r of rows) { if (timed && !placed && r.sort > nowMin) { body += '<div class="nowline"><span>지금</span></div>'; placed = true; } body += line(r); }
  if (timed && !placed) body += '<div class="nowline"><span>지금</span></div>';
  if (!rows.length) body += '<div class="small mute" style="padding:8px 0">오늘은 비어 있어요</div>';
  const askedHtml = asked.length ? `<div class="thead warn">요청받은 일 <span>${asked.length}</span></div>` + asked.map(r =>
    `<div class="trow"><span class="tm"></span><button class="ck" onclick="Native.openTodo ? Native.openTodo() : 0" aria-label="업무 기록에서"></button><div class="tx">${esc(r.title)}<div class="small ${r.late?'red':'mute'}">${esc(r.sub)}</div></div></div>`).join('') : '';
  const looseHtml = loose.length ? `<div class="thead" onclick="LOOSE_OPEN=!LOOSE_OPEN;town(RES,HOME)">적어 둔 일 <span>${loose.length} ${LOOSE_OPEN?'▲':'▼'}</span></div>` +
    (LOOSE_OPEN ? loose.map(r => `<div class="trow"><span class="tm"></span><button class="ck" onclick="doneTask('${r.id}', true)" aria-label="완료"></button><div class="tx">${esc(r.title)}</div></div>`).join('') : '') : '';
  const dw = '일월화수목금토'[new Date(D(t0)).getUTCDay()];
  // 업무 기록 위젯의 핵심 줄(2026-11-12 룡): ＋ 할 일 · 맡기기 · 요청받은 일 · 확인할 일
  const N = window.Native || {};
  // 순서(2026-11-12 룡): 요청 · 확인 · 맡기기 · ＋ 할 일(맨 오른쪽)
  const bar = !has('업무') ? '' : `<div class="tbar"><b class="warn" onclick="${N.openTodo ? 'Native.openTodo()' : ''}">요청 ${asked.length}</b><b class="ok" onclick="${N.openTodo ? 'Native.openTodo()' : ''}">확인 ${h.to_check || 0}</b>
    <b onclick="${N.todoAssign ? 'Native.todoAssign()' : ''}">맡기기</b><b onclick="${N.todoAdd ? 'Native.todoAdd()' : ''}">＋ 할 일</b></div>`;
  return `<div class="card today2"><h2>오늘 ${md(t0)} (${dw}) <span class="small" style="float:right">끝냄 ${h.tasks_done_today}</span></h2>${bar}${askedHtml}${calNote}${body}${looseHtml}</div>`;
}

}

// 영성 기록 사이트의 묵상 이미지와 같은 꼴(index.html drawMeditation): 날짜·장절 + ①~④ 답, 성경 본문 글은 넣지 않는다(저작권)
async function drawMeditation(d){
  const FONT = '"Pretendard Variable", Pretendard, system-ui, sans-serif';
  try { await Promise.all([700, 500, 400].map(w => document.fonts.load(`${w} 40px "Pretendard Variable"`, '가나다 1:1'))); } catch(e) {}
  const PAD = 48, CARD = 40, A4 = Math.SQRT2, c = document.createElement('canvas'), ctx = c.getContext('2d');
  const C = { bg:'#f6f5f1', card:'#ffffff', ink:'#1f1f1d', sub:'#6b6a64', line:'#e4e2db', accent:'#5b4a8b' };
  const f = (w, s) => `${w} ${s}px ${FONT}`;
  const wrap = (text, max) => { const out = []; for (const para of text.split('\n')) { if (!para.trim()) { out.push(''); continue; } let line = '';
      for (const word of para.split(/(\s+)/)) { if (!word) continue; if (ctx.measureText(line + word).width <= max) { line += word; continue; }
        if (line.trim()) { out.push(line.trimEnd()); line = ''; } if (/^\s+$/.test(word)) continue;
        for (const ch of word) { if (ctx.measureText(line + ch).width > max && line) { out.push(line); line = ''; } line += ch; } }
      out.push(line.trimEnd()); } return out; };
  const blockH = b => CARD + 44 + 22 + b.lines.length * 64 + CARD - 8;
  const layout = W => { const INNER = W - PAD*2; ctx.font = f(700,64); const tl = d.title ? wrap(d.title, INNER) : [];
    const bl = d.qa.map(([label, text]) => { ctx.font = f(400,40); return {label, lines: wrap(text, INNER - CARD*2)}; });
    let H = PAD + 40 + 36 + tl.length*84 + 64; H += bl.length ? bl.reduce((s,b) => s + blockH(b) + 32, 0) : 120; H += 40 + 40 + PAD - 20;
    return {W, INNER, tl, bl, H}; };
  let L = layout(1080); for (let w = 1120; L.H > L.W*A4 && w <= 1440; w += 40) L = layout(w);
  const {W, INNER, tl, bl} = L, H = Math.max(L.H, Math.round(W*A4));
  c.width = W; c.height = H; ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);
  const rr = (x,y,w,h,r) => { ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
  let y = PAD + 40; ctx.fillStyle = C.sub; ctx.font = f(500,34); ctx.fillText(`${d.date}  ·  묵상`, PAD, y); y += 36;
  ctx.fillStyle = C.ink; ctx.font = f(700,64); for (const l of tl) { y += 84; ctx.fillText(l, PAD, y); } y += 64;
  if (!bl.length) { ctx.fillStyle = C.sub; ctx.font = f(400,38); ctx.fillText('아직 적은 답이 없어요.', PAD, y + 40); }
  for (const b of bl) { const h = blockH(b); ctx.fillStyle = C.card; rr(PAD, y, INNER, h, 28); ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke();
    let by = y + CARD + 34; ctx.fillStyle = C.accent; ctx.font = f(700,34); ctx.fillText(b.label, PAD + CARD, by); by += 22;
    ctx.fillStyle = C.ink; ctx.font = f(400,40); for (const l of b.lines) { by += 64; ctx.fillText(l, PAD + CARD, by - 12); } y += h + 32; }
  ctx.fillStyle = C.sub; ctx.font = f(500,30); ctx.textAlign = 'right'; ctx.fillText('오늘의 묵상', W - PAD, H - PAD + 20); ctx.textAlign = 'left';
  return c.toDataURL('image/png');
}

// 🙏 감사 · 👏 칭찬 · 🏫 SOC · 🙌 순종 · 💡 깨달음: 적는 칸 + 오늘 적은 것
// 순종·깨달음(2026-11-16 룡 「묵상은 아침에 앉아서 시작하지만 순종한 것은 하루 중에 수집되는 거야. 깨달음도」): 하루 중 생길 때마다 한 줄. 순종은 오늘 묵상 「순종할 것」을 위에 보여 준다
const FW_KINDS = ['감사','칭찬','순종','깨달음','SOC'];
const FW_IC = {감사:'🙏', 칭찬:'👏', SOC:'🏫', 순종:'🙌', 깨달음:'💡'};
function openFw(k, keep){
  try { localStorage.setItem('rpg_fw_kind', k); } catch(e) {}
  const ic = FW_IC[k];
  const ph = {감사:'감사한 것', 칭찬:'무엇을 칭찬할까요', SOC:'있었던 일과 내 반응', 순종:'무엇을 했나요 (예: 점심 먹고 말씀 두 장 읽음)', 깨달음:'오늘 주신 깨달음'}[k];
  const obey = k === '순종' ? spOf('묵상').map(m => m.obey).filter(Boolean) : [];
  const s = sheet(`<h3>✍️ 오늘 기록</h3>
    <div class="chips">${FW_KINDS.map(x => `<span class="chip${x === k ? ' on' : ''}" data-kind="${x}">${FW_IC[x]} ${x}</span>`).join('')}</div>
    ${k === '순종' ? (obey.length ? `<div class="small" style="margin-bottom:8px">📖 오늘 묵상 순종할 것<div style="margin-top:4px">${obey.map(esc).join('<br>')}</div></div>` : `<div class="small mute" style="margin-bottom:8px">오늘 묵상이 아직 없어요. 한 것만 적어도 돼요</div>`) : ''}
    ${k === '칭찬' ? `<input id="tg" placeholder="누구를"><div class="chips">${(SP.targets||[]).map(t => `<span class="chip" data-t="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : ''}
    <textarea id="tx" rows="3" placeholder="${ph}" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px"></textarea>
    ${k === 'SOC' ? `<textarea id="ln" rows="2" placeholder="배운 것 (없으면 비워 두고 나중에)" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:6px"></textarea>` : ''}
    <div class="err" id="err"></div><button id="go">적기</button>
    <h2 style="margin-top:16px">오늘 적은 것</h2><div id="ls" class="small"></div>`);
  s.querySelectorAll('[data-t]').forEach(c => c.onclick = () => { s.querySelector('#tg').value = c.dataset.t; });
  // 종류 고르기: 쓰던 글은 그대로 들고 간다
  s.querySelectorAll('[data-kind]').forEach(c => c.onclick = () => { if (c.dataset.kind !== k) openFw(c.dataset.kind, s.querySelector('#tx').value); });
  if (keep) s.querySelector('#tx').value = keep;
  // 고치기·지우기(2026-11-17, 본인 것만 · 서버 rpg_spirit_edit·rpg_spirit_del)
  const acts = e => `<div class="small" style="margin-top:6px;text-align:right"><a href="#" data-ed="${e.id}">고치기</a> · <a href="#" data-del="${e.id}" style="color:#b33">지우기</a></div>`;
  const list = () => { const a = spOf(k);
    s.querySelector('#ls').innerHTML = a.length ? a.map(e => k === 'SOC'
      ? `<div class="task" style="display:block"><div>${esc(e.situation||'')}</div>${e.learned ? `<div class="mute" style="margin-top:4px">→ ${esc(e.learned)}</div>` : `<div class="mute" style="margin-top:4px"><span class="chip" data-l="${e.id}">배운 것 적기</span></div>`}${acts(e)}</div>`
      : `<div class="task" style="display:block">${e.target ? `<b>${esc(e.target)}</b> — ` : ''}${esc(e.body||'')}${acts(e)}</div>`).join('') : '<span class="mute">아직 없어요</span>';
    const ta = 'width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:4px';
    s.querySelectorAll('[data-del]').forEach(c => c.onclick = ev => { ev.preventDefault();
      const row = c.parentElement;
      row.innerHTML = `지울까요? <a href="#" data-yes style="color:#b33">지우기</a> · <a href="#" data-no>아니요</a>`;
      row.querySelector('[data-no]').onclick = x => { x.preventDefault(); list(); };
      row.querySelector('[data-yes]').onclick = async x => { x.preventDefault();
        try { const r = await rpc('rpg_spirit_del', {p_token: token(), p_id: c.dataset.del});
          if (r.error) return toast(r.error);
          await spiritDay(); list(); toast('지웠어요'); load();
        } catch(e) { toast(errMsg(e)); } };
    });
    s.querySelectorAll('[data-ed]').forEach(c => c.onclick = ev => { ev.preventDefault();
      const e = a.find(x => x.id === c.dataset.ed); if (!e) return;
      const box = c.closest('.task');
      box.innerHTML = (k === '칭찬' ? `<input data-f="tg" placeholder="누구를" value="${esc(e.target||'')}">` : '')
        + `<textarea data-f="tx" rows="3" style="${ta}">${esc(k === 'SOC' ? e.situation||'' : e.body||'')}</textarea>`
        + (k === 'SOC' ? `<textarea data-f="ln" rows="2" placeholder="배운 것" style="${ta}">${esc(e.learned||'')}</textarea>` : '')
        + `<div class="row" style="gap:8px;margin-top:6px"><button class="ghost" data-f="no" style="padding:8px">취소</button><button data-f="ok" style="padding:8px">저장</button></div>`;
      const f = n => box.querySelector(`[data-f="${n}"]`);
      f('no').onclick = () => list();
      f('ok').onclick = async () => {
        const tx = f('tx').value.trim(); if (!tx) return toast('적을 것을 넣어 주세요');
        const args = {p_token: token(), p_id: e.id, p_text: tx};
        if (k === '칭찬') args.p_target = f('tg').value.trim();
        if (k === 'SOC') args.p_learned = f('ln').value.trim();
        try { const r = await rpc('rpg_spirit_edit', args);
          if (r.error) return toast(r.error);
          await spiritDay(); list(); toast('고쳤어요');
        } catch(err) { toast(errMsg(err)); }
      };
    });
    // 앱(WebView)에서는 prompt() 창이 안 떠서 그 자리에 칸을 연다
    s.querySelectorAll('[data-l]').forEach(c => c.onclick = () => {
      const box = c.parentElement;
      box.innerHTML = `<input placeholder="배운 것"><button style="margin-top:4px;padding:8px">적기</button>`;
      box.querySelector('input').focus();
      box.querySelector('button').onclick = async () => {
        const v = box.querySelector('input').value.trim(); if (!v) return;
        const r = await rpc('rpg_spirit_learned', {p_token: token(), p_id: c.dataset.l, p_learned: v}).catch(e => ({error: errMsg(e)}));
        if (r && r.ok) { await spiritDay(); list(); toast('배운 것 적었어요'); } else toast(r && r.error || '저장하지 못했어요.' + AGAIN);
      };
    }); };
  list();
  s.querySelector('#go').onclick = async () => {
    const tx = s.querySelector('#tx').value.trim(), err = s.querySelector('#err');
    if (!tx) { err.textContent = {감사:'감사한 것을 적어 주세요', 칭찬:'무엇을 칭찬할지 적어 주세요', SOC:'있었던 일을 적어 주세요', 순종:'한 것을 적어 주세요', 깨달음:'깨달은 것을 적어 주세요'}[k]; return; }
    const args = {p_token: token(), p_kind: k, p_text: tx};
    if (k === '칭찬') args.p_target = s.querySelector('#tg').value.trim();
    if (k === 'SOC') args.p_learned = s.querySelector('#ln').value.trim();
    try { const r = await rpc('rpg_spirit_add', args);
      if (r.error) { err.textContent = r.error; return; }
      s.querySelector('#tx').value = ''; if (k === 'SOC') s.querySelector('#ln').value = '';
      await spiritDay(); list(); toast(k + ' 적었어요'); load();
    } catch(e) { err.textContent = errMsg(e); }
  };
  s.querySelector('#tx').oninput = () => { s.querySelector('#err').textContent = ''; };
}

// 📝 일기: 오늘 일기(있으면 이어서 고침)
function openDiary(){
  const cur = spOf('일기')[0];
  // 오늘 모인 것(순종·깨달음·감사·칭찬·SOC)을 일기 위에 보여 준다: 일기 쓸 때 보고 쓰게(2026-11-16 룡)
  const got = [['순종','🙌'],['깨달음','💡'],['감사','🙏'],['칭찬','👏'],['SOC','🏫']]
    .flatMap(([k, ic]) => spOf(k).map(e => `<div>${ic} ${e.target ? `<b>${esc(e.target)}</b> — ` : ''}${esc(e.body || e.situation || '')}</div>`));
  // 일기 쓸 때 오늘 묵상과 오늘 기록을 버튼으로 펼쳐 본다(2026-11-18 룡 「오늘 기록의 합본은 일기 쓸 때」)
  const mq = spOf('묵상')[0] || {};
  const med = [['verse','📖'],['hear','① 말씀하시는 것'],['obey','② 순종할 것'],['pray','③ 기도제목'],['why','④ 왜 필요했나']]
    .filter(([k]) => (mq[k] || '').trim()).map(([k, l]) => `<div><span class="mute">${l}</span> ${esc(mq[k].trim())}</div>`);
  const s = sheet(`<h3>📝 오늘 일기</h3>
    <div class="chips" style="margin-bottom:6px"><span class="chip" data-see="med">📖 묵상 ${med.length ? '' : '(아직)'}</span><span class="chip" data-see="got">✍️ 오늘 기록 ${got.length ? got.length+'개' : '(아직)'}</span></div>
    <div id="see-med" class="small" style="display:none;margin-bottom:8px;line-height:1.6">${med.join('') || '<span class="mute">오늘 묵상이 아직 없어요</span>'}</div>
    <div id="see-got" class="small" style="display:none;margin-bottom:8px;line-height:1.6">${got.join('') || '<span class="mute">오늘 적은 것이 아직 없어요</span>'}</div>
    <textarea id="tx" rows="10" placeholder="오늘 하루" style="width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;line-height:1.6">${esc(cur ? cur.body || '' : '')}</textarea>
    <div class="err" id="err"></div><button id="go">${cur ? '고쳐 저장' : '저장'}</button>`);
  s.querySelectorAll('[data-see]').forEach(c => c.onclick = () => { const el = s.querySelector('#see-' + c.dataset.see); const on = el.style.display === 'none'; el.style.display = on ? '' : 'none'; c.classList.toggle('on', on); });
  s.querySelector('#go').onclick = async () => {
    const tx = s.querySelector('#tx').value, err = s.querySelector('#err');
    if (!tx.trim()) { err.textContent = '일기를 적어 주세요'; return; }
    try { const r = await rpc('rpg_diary_save', {p_token: token(), p_body: tx});
      if (r.error) { err.textContent = r.error; return; }
      closeSheet(); toast('일기 저장했어요'); load();
    } catch(e) { err.textContent = errMsg(e); }
  };
}
window.onNative = ev => {
  // 잠금화면 위에 뜰 때: 열려 있던 창을 다 닫고 마을로(잠금을 안 푼 사람에게 적던 글·보고서가 보이지 않게)
  if (ev === 'lock') { document.querySelectorAll('.sheet,.ov,.doc').forEach(x => x.remove()); try { if (CUR !== 'town' && document.getElementById('nav').style.display !== 'none') tab('town'); } catch (e) {} requestAnimationFrame(fitBubbles); return; }
  if (ev === 'resume') { load(); const ss = document.getElementById('setupSheet'); if (ss) setupView(ss.dataset.pack, window._gateGo); return; }
  // 한 번에 켜기가 끝남: 다시 그리고, 다 켜졌으면 알린다
  if (ev === 'perms') { const ss = document.getElementById('setupSheet'); const pk = ss ? ss.dataset.pack : '', go = window._gateGo;
    if (pk && go && !perms([pk]).some(p => !p.on && p.pack === pk)) { closeSheet(); window._gateGo = null; go(); return; }   // 그 기록 것이 다 켜졌으면 바로 연다
    if (ss) setupView(pk, go); if (!perms(pk ? [pk] : null).some(p => !p.on)) toast('다 켰어요'); } };
let y0 = null; // 아래로 당기면 새로고침
addEventListener('touchstart', e => { y0 = scrollY === 0 ? e.touches[0].clientY : null; }, {passive:true});
addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) { toast('새로 불러와요'); load(); } y0 = null; });
load();
</script>
