<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이프 RPG</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1f1d;--mute:#6b6a64;--line:#e4e2db;--brand:#3b5b8c;--brand2:#e8eef7;--ok:#2f7d5b;--gray:#b9b7af}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:14px 14px 40px;max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:15px;font-weight:600;margin:0 0 10px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.mute{color:var(--mute)}.small{font-size:13px}
.bar{height:8px;background:#eeece6;border-radius:5px;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .6s}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--brand2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex:none}
.lv{font-size:28px;font-weight:700;color:var(--brand)}
.stat{display:grid;grid-template-columns:42px 1fr 64px;align-items:center;gap:8px;margin:9px 0;font-size:14px}
.stat .n{text-align:right;color:var(--mute);font-size:13px}
.stat.off{color:var(--gray)}.stat.off .bar>i{background:#ddd}
.today li{list-style:none;padding:7px 0;border-bottom:1px solid #f0eee8;display:flex;gap:8px;font-size:14px}
.today li:last-child{border:0}.today ul{margin:0;padding:0}
.today .xp{margin-left:auto;color:var(--ok);font-weight:600}
.today .not{color:var(--gray)}
.pill{display:inline-block;background:var(--brand2);color:var(--brand);border-radius:20px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.banner{background:#eef6f1;color:#245c43;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
button{font:inherit;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:12px 16px;width:100%;font-weight:600}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.err{color:#b33;font-size:13px;min-height:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9;padding:24px}
.ov .card{width:100%;max-width:360px;text-align:center}
.big{font-size:44px;font-weight:800;color:var(--brand);margin:6px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f1f1d;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:10;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
svg text{font-family:inherit}
.foot{text-align:center;font-size:12px;color:var(--gray);margin-top:14px}
body.tabs{padding-bottom:84px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
.nav b{flex:1;text-align:center;padding:12px 0 14px;font-size:14px;color:var(--mute);font-weight:600}
.nav b.on{color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mini .lv{font-size:22px}
.town{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;position:relative;min-height:138px}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:44px;line-height:1.1}
.tile .nm{font-weight:700;margin-top:6px;font-size:16px}
.tile .st{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.4}
.tile .got{position:absolute;top:8px;right:8px;background:#eef6f1;color:var(--ok);font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:8;display:flex;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.sheet h3{margin:0 0 12px;font-size:18px}
.faces{display:flex;gap:10px}.faces button{font-size:30px;background:#fff;border:1px solid var(--line);padding:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 12px;font-size:13px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{background:#fff;color:var(--mute);border:1px solid var(--line);padding:9px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
select{width:100%;font:inherit;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
.task{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.task .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--brand);flex:none;background:#fff}
.task .tt{flex:1;font-size:14px}
.town3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tile.sm{min-height:0;padding:10px 6px}.tile.sm .ic{font-size:30px}.tile.sm .nm{font-size:14px;margin-top:2px}.tile.sm .st{font-size:11px}
.today2 .trow{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid #f0eee8;font-size:14px}
.today2 .trow:last-child{border:0}
.today2 .tm{width:40px;flex:none;color:var(--mute);font-size:12px;padding-top:2px}
.today2 .tx{flex:1;min-width:0;word-break:keep-all}
.today2 .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--brand);background:#fff;padding:0;flex:none}
.today2 .evbar{width:4px;align-self:stretch;background:#3b6fb6;border-radius:2px;flex:none}
.today2 .faded{color:#9a9890}.today2 .faded .evbar{background:#cfcdc5}
.today2 .red{color:#d62d1c!important}
.today2 .thead{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#2f5d50;padding:10px 0 4px}
.today2 .thead.warn{color:#b26a00}
.today2 .perm{color:#2f5d50;display:block}
.nowline{display:flex;align-items:center;gap:6px;color:#d62d1c;font-size:11px;font-weight:700;margin:2px 0}
.nowline::after{content:"";flex:1;height:1px;background:#d62d1c}
.reward{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font-size:34px;font-weight:800;color:var(--ok);z-index:12;pointer-events:none;animation:rw 1.4s ease-out forwards}
@keyframes rw{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
</style>
</head>
<body>
<div id="town"></div>
<div id="app"><div class="card mute">불러오는 중…</div></div>
<div class="nav" id="nav" style="display:none"><b id="t-town" onclick="tab('town')">🏘️ 마을</b><b id="t-app" onclick="tab('app')">📊 상태창</b></div>
<div id="toast" class="toast"></div>
<script>
// ===== 규칙 (설계안 2판, 2026-11-12 룡 컨펌) =====
// 단위 하나: 영역마다 기록한 날 하루 = 10. 재정·관계는 하루 25, 한 주 70까지(주 3일이면 가득).
// 영역 레벨: 다음 레벨까지 10 × (지금 레벨 + 1). 누적 = 5L² + 5L − 10.
// 캐릭터 레벨 = (영역 레벨 합 + 가장 낮은 영역 × 2) ÷ (영역 수 + 2). 고르게 클수록 빨리 오름.
// 한 번 닿은 레벨은 내려가지 않음(서버 rpg_players.peaks). 벌칙·끊김 표시 없음.
const AREAS = ['일','관계','재정','건강','지성','영성'];
const WEEKLY = {'재정':1,'관계':1};
const READY = {'지성':'지성 기록이 생기면 시작돼요'}; // 아직 수집 통로가 없는 영역
const BADGE_DAYS = [10,30,100,200,365,500,1000,2000,3650];
const SEASON0 = '2026-11-09'; // 첫 시즌 시작(월), 13주씩

// ===== 날짜 =====
const D = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); };
const S = t => new Date(t).toISOString().slice(0,10);
const add = (s,n) => S(D(s)+n*864e5);
const monday = s => { const w = (new Date(D(s)).getUTCDay()+6)%7; return add(s,-w); };
const md = s => (+s.slice(5,7))+'/'+(+s.slice(8,10));

// ===== 서버 =====
const KEY = 'sb_publishable_BqE1VCDg50oi9zCflCjMuw_wYF55CTj', SB = 'https://trlnatdkebjvgiqneulv.supabase.co';
const cbs = {}; let cbN = 0;
window.__rpc = (cb, status, body) => { const f = cbs[cb]; delete cbs[cb]; f && f(status, body); };
function rpc(fn, args){
  return new Promise((ok, no) => {
    const done = (st, body) => { let j = null; try { j = JSON.parse(body); } catch(e){}
      if (st >= 200 && st < 300) ok(j); else no({status:st, body:j}); };
    if (window.Native) { const id = 'c'+(++cbN); cbs[id] = done; Native.rpc(fn, JSON.stringify(args||{}), id); }
    else fetch(SB+'/rest/v1/rpc/'+fn, {method:'POST', headers:{apikey:KEY,'Content-Type':'application/json'}, body:JSON.stringify(args||{})})
      .then(r => r.text().then(t => done(r.status, t))).catch(() => done(0, ''));
  });
}
const token = () => window.Native ? Native.token() : (localStorage.getItem('rpg_token')||'');
const setToken = t => window.Native ? Native.setToken(t) : localStorage.setItem('rpg_token', t);
const ls = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
             set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===== 계산 =====
const cum = L => 5*L*L + 5*L - 10;
function levelOf(xp){ let L = 1; while (cum(L+1) <= xp) L++; const need = 10*(L+1), into = xp - cum(L); return {L, into, need, f: L + into/need}; }

function compute(data){
  const today = data.today, byArea = {};
  AREAS.forEach(a => byArea[a] = {}); // 날짜 → {항목: 개수}
  for (const [d,a,i,n] of data.rows) { if (!byArea[a]) continue; (byArea[a][d] = byArea[a][d] || {})[i] = n; }
  const wk0 = monday(today), m28 = add(today,-27), p28 = add(today,-55);
  const res = {today, areas:{}};
  for (const a of AREAS) {
    const days = Object.keys(byArea[a]).sort();
    const r = {a, days, ready: !READY[a] || days.length > 0};
    let xp = 0, todayXp = 0;
    if (WEEKLY[a]) {
      const wk = {}; days.forEach(d => { const k = monday(d); wk[k] = (wk[k]||0) + 1; });
      for (const k in wk) xp += Math.min(70, 25*wk[k]);
      if (byArea[a][today]) { const n = wk[wk0]||0; todayXp = Math.min(70,25*n) - Math.min(70,25*(n-1)); }
    } else { xp = 10*days.length; if (byArea[a][today]) todayXp = 10; }
    r.xp = xp; r.todayXp = todayXp; r.lv = levelOf(xp);
    r.week = days.filter(d => d >= wk0).length;
    r.d28 = days.filter(d => d >= m28).length;
    r.p28 = days.filter(d => d >= p28 && d < m28).length;
    r.shape = WEEKLY[a] ? Math.min(1, r.d28/12) : r.d28/28;
    r.todayItems = byArea[a][today] || null;
    r.total = days.length;
    r.next = BADGE_DAYS.find(b => b > r.total) || null;
    r.prevB = [...BADGE_DAYS].reverse().find(b => b <= r.total) || 0;
    res.areas[a] = r;
  }
  const act = AREAS.filter(a => res.areas[a].ready);
  const fs = act.map(a => res.areas[a].lv.f), mn = Math.min(...fs);
  res.char = (fs.reduce((x,y) => x+y, 0) + 2*mn) / (act.length + 2);
  res.minArea = act.reduce((m,a) => res.areas[a].lv.f < res.areas[m].lv.f ? a : m, act[0]);
  res.todayXp = act.reduce((s,a) => s + res.areas[a].todayXp, 0);
  res.totalXp = act.reduce((s,a) => s + res.areas[a].xp, 0);
  // 고른 주: 그 주(월~일)에 시작된 영역이 모두 한 번 이상
  const season = Math.floor((D(today) - D(SEASON0)) / (91*864e5));
  const sStart = add(SEASON0, season*91);
  res.season = season + 1; res.seasonStart = sStart; res.seasonEnd = add(sStart, 90);
  let bal = 0, balNow = false;
  for (let w = sStart; w <= today; w = add(w,7)) {
    const ok = act.every(a => res.areas[a].days.some(d => d >= w && d < add(w,7)));
    if (ok) { bal++; if (w === wk0) balNow = true; }
  }
  res.balWeeks = bal; res.balNow = balNow;
  res.weekIdx = Math.floor((D(today) - D(sStart)) / (7*864e5)) + 1;
  return res;
}

// 한 번 닿은 값은 안 내려감
function applyPeaks(res, peaks){
  peaks = peaks || {};
  res.charShown = Math.max(res.char, +peaks.char || 0);
  for (const a of AREAS) { const r = res.areas[a]; r.lvShown = Math.max(r.lv.L, +peaks[a] || 0); }
  const out = {char: +res.char.toFixed(3)};
  AREAS.forEach(a => out[a] = res.areas[a].lv.L);
  return out;
}

// ===== 화면 =====
const ITEM = {'할 일 끝냄':'할 일 끝냄','기상':'기상','취침':'취침','운동':'운동','식단':'식단','오운완':'오운완','묵상':'묵상','SOC':'SOC','감사':'감사','칭찬':'칭찬','일기':'일기','가정 장부':'가정 장부','기업 장부':'기업 장부','통화':'통화','메모':'메모','카톡 1:1':'카톡 1:1'};
function itemsText(it){ return Object.entries(it).map(([k,n]) => (ITEM[k]||k) + (n > 1 ? ' '+n : '')).join(' · '); }

function radar(res){
  const act = AREAS, cx = 110, cy = 105, R = 78;
  const pt = (i, r) => { const t = -Math.PI/2 + i*2*Math.PI/act.length; return [cx + r*Math.cos(t), cy + r*Math.sin(t)]; };
  const ring = k => act.map((_,i) => pt(i, R*k).join(',')).join(' ');
  const shape = act.map((a,i) => pt(i, R*Math.max(.04, res.areas[a].ready ? res.areas[a].shape : 0)).join(',')).join(' ');
  const labels = act.map((a,i) => { const [x,y] = pt(i, R+16); return `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" fill="${res.areas[a].ready?'#6b6a64':'#b9b7af'}">${a}</text>`; }).join('');
  return `<svg viewBox="0 0 220 210" width="100%" style="max-width:280px;display:block;margin:0 auto">
    ${[.33,.66,1].map(k => `<polygon points="${ring(k)}" fill="none" stroke="#e4e2db"/>`).join('')}
    <polygon points="${shape}" fill="rgba(59,91,140,.18)" stroke="#3b5b8c" stroke-width="2"/>${labels}</svg>`;
}

let RES = null;
function render(res, data){
  RES = res;
  const cl = Math.floor(res.charShown), cp = res.charShown - cl;
  const last = ls.get('rpg_last', null);
  let banner = '';
  if (last && last.date < add(res.today,-1) && res.totalXp > last.xp)
    banner = `<div class="banner">${md(last.date)} 뒤로 쌓인 것: +${res.totalXp - last.xp} EXP</div>`;
  const stats = AREAS.map(a => { const r = res.areas[a];
    if (!r.ready) return `<div class="stat off"><span>${a}</span><div class="bar"><i style="width:0"></i></div><span class="n">준비 중</span></div>`;
    return `<div class="stat"><span>${a}</span><div class="bar"><i style="width:${Math.round(r.lv.into/r.lv.need*100)}%"></i></div><span class="n">Lv ${r.lvShown}</span></div>`; }).join('');
  const todayList = AREAS.map(a => { const r = res.areas[a];
    if (!r.ready) return `<li class="not">· ${a} — ${READY[a]}</li>`;
    if (!r.todayItems) return `<li class="not">· ${a} <span style="margin-left:auto" class="small">이번 주 ${r.week}일</span></li>`;
    return `<li><span>✓ ${a} · ${esc(itemsText(r.todayItems))}</span><span class="xp">${r.todayXp ? '+'+r.todayXp : '가득'}</span></li>`; }).join('');
  const cmp = AREAS.filter(a => res.areas[a].ready).map(a => { const r = res.areas[a], d = r.d28 - r.p28;
    return `<span class="pill">${a} ${r.d28}일${d ? (d > 0 ? ' ▲'+d : ' ▽'+(-d)) : ''}</span>`; }).join('');
  const badges = AREAS.filter(a => res.areas[a].ready).map(a => { const r = res.areas[a];
    const pct = r.next ? Math.round((r.total - r.prevB)/(r.next - r.prevB)*100) : 100;
    return `<div class="stat"><span>${a}</span><div class="bar"><i style="width:${pct}%;background:#c9a227"></i></div><span class="n">${r.total}${r.next ? '/'+r.next : ''}일</span></div>`; }).join('');
  document.getElementById('app').innerHTML = `
    ${banner}
    <div class="card">
      <div class="row"><div class="avatar">${esc((data.name||'나').slice(0,1))}</div>
        <div style="flex:1"><div class="row"><span class="lv">Lv ${cl}</span><span class="mute small">${esc(data.name||'')}</span></div>
        <div class="row" style="margin-top:6px"><div class="bar"><i style="width:${Math.round(cp*100)}%"></i></div><span class="small mute">${Math.round(cp*100)}%</span></div></div></div>
      <div class="small mute" style="margin-top:10px">고르게 기를수록 빨리 올라요 · 지금 가장 작은 칸: <b>${res.minArea}</b></div>
    </div>
    <div class="card today"><h2>오늘 나아간 것 <span class="small" style="float:right">+${res.todayXp} EXP</span></h2><ul>${todayList}</ul></div>
    <div class="card"><h2>능력치</h2>${stats}</div>
    <div class="card"><h2>최근 4주 모양</h2>${radar(res)}<div style="margin-top:8px">${cmp}</div>
      <div class="small mute" style="margin-top:6px">▲▽ = 그 전 4주와 비교한 기록한 날</div></div>
    <div class="card"><h2>시즌 ${res.season} · ${res.weekIdx}/13주 <span class="small" style="float:right">${md(res.seasonStart)}~${md(res.seasonEnd)}</span></h2>
      <div class="small">고른 주(모든 칸 한 번 이상): <b>${res.balWeeks}주</b>${res.balNow ? ' · 이번 주 ✓' : ''} <span class="mute">· 배지 1·4·8·12주</span></div></div>
    <div class="card"><h2>누적 배지 (기록한 날)</h2>${badges}</div>
    <div class="foot">마을에서 적은 것도 각 기록 앱에 똑같이 쌓여요<br>
      <span onclick="logout()" style="text-decoration:underline">로그아웃</span>${window.Native ? ' · 버전 '+Native.version() : ''}</div>`;
  levelUps(res, cl);
  ls.set('rpg_last', {date: res.today, xp: res.totalXp});
  if (window.Native && Native.setSummary) Native.setSummary(JSON.stringify({
    lv: cl, pct: Math.round(cp*100), today: res.today,
    on: AREAS.map(a => res.areas[a].ready ? (res.areas[a].todayItems ? 1 : 0) : -1), names: AREAS, xp: res.todayXp }));
}

function levelUps(res, cl){
  const seen = ls.get('rpg_seen', null), now = {char: cl};
  AREAS.forEach(a => now[a] = res.areas[a].lvShown);
  ls.set('rpg_seen', now);
  if (!seen) return;
  if (cl > (seen.char||0)) {
    const o = document.createElement('div'); o.className = 'ov';
    o.innerHTML = `<div class="card"><div class="mute">레벨 업</div><div class="big">Lv ${cl}</div><div class="small mute">여섯 칸을 고르게 기른 만큼 올랐어요</div><button style="margin-top:14px">좋아요</button></div>`;
    o.onclick = () => o.remove(); document.body.appendChild(o); return;
  }
  const up = AREAS.filter(a => res.areas[a].lvShown > (seen[a]||0));
  if (up.length) toast(up.map(a => a+' Lv '+res.areas[a].lvShown).join(' · ') + ' 올랐어요');
}

async function load(){
  if (!token()) return loginView();
  try {
    const [data, home] = await Promise.all([rpc('rpg_days', {p_token: token()}), rpc('rpg_home', {p_token: token()})]);
    const before = RES ? RES.totalXp : null;
    const res = compute(data), peaks = applyPeaks(res, data.peaks);
    HOME = home;
    render(res, data);
    town(res, home);
    document.getElementById('nav').style.display = 'flex';
    document.body.classList.add('tabs');
    tab(CUR);
    if (before !== null && res.totalXp > before) reward('+' + (res.totalXp - before) + ' EXP');
    rpc('rpg_save_peaks', {p_token: token(), p_peaks: peaks}).catch(() => {});
  } catch(e) {
    if (e && e.body && JSON.stringify(e.body).includes('auth')) { setToken(''); return loginView(); }
    if (!RES) document.getElementById('app').innerHTML = `<div class="card">인터넷이 안 되거나 서버가 대답하지 않아요.<br><br><button onclick="load()">다시</button></div>`;
    else toast('새로 못 불러왔어요');
  }
}

function loginView(){
  document.getElementById('nav').style.display = 'none';
  document.getElementById('town').innerHTML = '';
  document.getElementById('app').style.display = '';
  document.body.classList.remove('tabs');
  document.getElementById('app').innerHTML = `<div class="card"><h2 style="color:var(--ink);font-size:18px">라이프 RPG</h2>
    <div class="small mute">업무 기록 아이디(예: 깐깐룡이)와 비밀번호</div>
    <input id="id" autocomplete="username" placeholder="아이디"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <div class="err" id="err"></div><button id="go">들어가기</button></div>`;
  document.getElementById('go').onclick = async () => {
    const id = document.getElementById('id').value, pw = document.getElementById('pw').value, err = document.getElementById('err');
    err.textContent = '';
    if (!id || !pw) { err.textContent = '아이디와 비밀번호를 넣어 주세요'; return; }
    try { const r = await rpc('rpg_login', {p_id: id, p_pw: pw});
      if (r.error) { err.textContent = r.error; return; }
      setToken(r.token); load();
    } catch(e) { err.textContent = '인터넷을 확인해 주세요'; }
  };
}

window.logout = () => { const t = token(); rpc('rpg_logout', {p_token: t}).catch(() => {}); setToken(''); ls.set('rpg_seen', null); loginView(); };
window.appBack = () => {
  const o = document.querySelector('.ov, .sheet'); if (o) { o.remove(); return true; }
  if (CUR !== 'town' && document.getElementById('nav').style.display !== 'none') { tab('town'); return true; }
  return false;
};

// ===== 마을: 아이콘으로 바로 기록 (2단계, 2026-11-12 룡) =====
// 기록은 기존 앱과 같은 표에 쌓인다: 집 = 건강 기록, 지갑 = 재정 기록, 퀘스트 = 업무 기록, 아빠 집 = 영성 기록 앱을 연다.
let HOME = null, CUR = ls.get('rpg_tab', 'town');
function tab(t){
  CUR = t; ls.set('rpg_tab', t);
  document.getElementById('town').style.display = t === 'town' ? '' : 'none';
  document.getElementById('app').style.display = t === 'app' ? '' : 'none';
  document.getElementById('t-town').className = t === 'town' ? 'on' : '';
  document.getElementById('t-app').className = t === 'app' ? 'on' : '';
  scrollTo(0, 0);
}
function reward(txt){ const r = document.createElement('div'); r.className = 'reward'; r.textContent = txt; document.body.appendChild(r); setTimeout(() => r.remove(), 1500); }
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const FACE = {1:'😫', 2:'😐', 3:'😄'};

function town(res, h){
  const cl = Math.floor(res.charShown), cp = res.charShown - cl;
  const got = a => res.areas[a].todayItems ? `<span class="got">${res.areas[a].todayXp ? '+'+res.areas[a].todayXp : '✓'}</span>` : '';
  const hh = h.health;
  const homeSt = !hh ? '건강 기록 계정 없음'
    : hh.need === 'bed_yesterday' ? '어젯밤 잔 시각부터'
    : hh.need === 'wake' ? '아직 안 일어남'
    : hh.bed ? `일어남 ${hh.wake} · 잠 ${hh.bed}` : `일어남 ${hh.wake} ${FACE[hh.condition]||''}`;
  const sp = h.spirit_today || [];
  document.getElementById('town').innerHTML = `
    <div class="mini"><span class="lv">Lv ${cl}</span><div class="bar"><i style="width:${Math.round(cp*100)}%"></i></div>
      <span class="small mute">오늘 +${res.todayXp}</span></div>
    <div class="town3">
      <div class="tile sm" onclick="openHome()">${got('건강')}<div class="ic">🏠</div><div class="nm">집</div><div class="st">${homeSt}</div></div>
      <div class="tile sm" onclick="openWallet()">${got('재정')}<div class="ic">👛</div><div class="nm">지갑</div><div class="st">${h.fin_today ? '오늘 '+h.fin_today+'건' : '돈 썼을 때'}</div></div>
      <div class="tile sm" onclick="openFather()">${got('영성')}<div class="ic">⛪</div><div class="nm">아빠 집</div><div class="st">${sp.length ? sp.join('·')+' ✓' : '아직'}</div></div>
    </div>
    ${todayCard(h, res)}
    <div class="small mute" style="text-align:center">관계(통화·카톡)는 자동으로 들어와요</div>`;
  if (PENDING) { const p = PENDING; PENDING = null; openFrom(p); }
}
// 위젯 버튼(🏠 👛 ⛪)으로 열렸을 때: 불러온 뒤 그 창을 연다
let PENDING = null;
window.openFrom = k => {
  if (!HOME) { PENDING = k; return; }
  tab('town');
  ({home: openHome, wallet: openWallet, father: openFather})[k]?.();
};

// ===== 오늘: 일정 + 할 일 (업무 기록 캘린더 위젯과 같은 나누기, 2026-11-12 룡 「기본 화면은 내 일정과 할 일」) =====
// 맨 위 요청받은 일 → 오늘 줄(지난 할 일 · 하루 종일 · 시간 순, 지금 줄) → 적어 둔 일(날짜 없는 내 일, 접힘)
let LOOSE_OPEN = false;
const hm = ms => { const d = new Date(ms + 9*3600e3); return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0'); };
function tagOf(name){ for (const t of ['룡','월','영']) if ((name||'').includes(t)) return t; return null; }
function others(title, tag){ if (!tag) return false; const c = title.indexOf(' - '); if (c <= 0 || c > 12) return false; const w = title.slice(0,c); return !w.includes(tag) && !w.includes('가족') && !w.includes('모두'); }
function todayCard(h, res){
  const t0 = h.today, me = h.name, rows = [], asked = [], loose = [];
  let calNote = '';
  if (window.Native && Native.calendar) {
    const raw = Native.calendar(t0);
    if (raw === null || raw === undefined) calNote = `<div class="trow perm" onclick="Native.askCalendar()">📅 눌러서 캘린더 보기를 허용해 주세요<div class="small mute">허용하면 오늘 일정이 여기에 같이 보여요</div></div>`;
    else { const from = D(t0) - 9*3600e3, tag = tagOf(me);
      for (const e of JSON.parse(raw)) {
        const r = {kind:'event', title: e.title || '(제목 없음)', id: e.id, begin: e.begin, end: e.end, faded: others(e.title||'', tag)};
        if (e.allDay) { r.time = '하루'; r.sort = -1; }
        else { r.time = e.begin < from ? '이어짐' : hm(e.begin); r.sort = e.begin < from ? -1 : Math.round((e.begin - from)/60000);
               if (e.end <= from + 864e5) r.sub = '~' + hm(e.end); }
        rows.push(r);
      } }
  }
  for (const t of h.tasks) {
    const due = t.due || '', remind = t.remind || '', rday = remind.slice(0,10);
    const r = {kind:'task', id: t.id, title: (t.important ? '★ ' : '') + t.title, mine: t.requester === me, company: t.company};
    if (!r.mine) { const w = due || rday; r.sub = (t.requester ? t.requester+' 요청' : '') + (w ? ' · '+md(w)+'까지' : ''); r.late = w && w < t0; asked.push(r); continue; }
    if (!due && !rday) { loose.push(r); continue; }
    const late = due && due < t0, hit = late || due === t0 || rday === t0 || (!due && rday < t0);
    if (!hit) continue;
    if (rday === t0 && remind.length >= 16) { r.time = remind.slice(11,16); r.sort = +r.time.slice(0,2)*60 + +r.time.slice(3,5); r.sub = '🔔' + (due > t0 ? ' · '+md(due)+'까지' : ''); }
    else if (late) { r.time = '지남'; r.sort = -2; r.sub = md(due)+'까지'; r.late = true; }
    else { r.time = '하루'; r.sort = -1; }
    rows.push(r);
  }
  rows.sort((a,b) => a.sort - b.sort);
  const nowMin = (() => { const d = new Date(Date.now() + 9*3600e3); return d.getUTCHours()*60 + d.getUTCMinutes(); })();
  const line = r => r.kind === 'event'
    ? `<div class="trow ev${r.faded?' faded':''}" onclick="Native.openEvent('${r.id}','${r.begin}','${r.end}')"><span class="tm">${r.time}</span><span class="evbar"></span><div class="tx">${esc(r.title)}${r.sub?`<div class="small mute">${r.sub}</div>`:''}</div></div>`
    : `<div class="trow"><span class="tm${r.late?' red':''}">${r.time||''}</span><button class="ck" onclick="doneTask('${r.id}', ${r.mine})" aria-label="완료"></button><div class="tx">${esc(r.title)}${r.sub||r.company?`<div class="small ${r.late?'red':'mute'}">${[r.sub, r.company].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div></div>`;
  let body = '', placed = false; const timed = rows.some(r => r.sort >= 0);
  for (const r of rows) { if (timed && !placed && r.sort > nowMin) { body += '<div class="nowline"><span>지금</span></div>'; placed = true; } body += line(r); }
  if (timed && !placed) body += '<div class="nowline"><span>지금</span></div>';
  if (!rows.length) body += '<div class="small mute" style="padding:8px 0">오늘은 비어 있어요</div>';
  const askedHtml = asked.length ? `<div class="thead warn">요청받은 일 <span>${asked.length}</span></div>` + asked.map(r =>
    `<div class="trow"><span class="tm"></span><button class="ck" onclick="Native.openTodo ? Native.openTodo() : 0" aria-label="업무 기록에서"></button><div class="tx">${esc(r.title)}<div class="small ${r.late?'red':'mute'}">${esc(r.sub)}</div></div></div>`).join('') : '';
  const looseHtml = loose.length ? `<div class="thead" onclick="LOOSE_OPEN=!LOOSE_OPEN;town(RES,HOME)">적어 둔 일 <span>${loose.length} ${LOOSE_OPEN?'▲':'▼'}</span></div>` +
    (LOOSE_OPEN ? loose.map(r => `<div class="trow"><span class="tm"></span><button class="ck" onclick="doneTask('${r.id}', true)" aria-label="완료"></button><div class="tx">${esc(r.title)}</div></div>`).join('') : '') : '';
  const dw = '일월화수목금토'[new Date(D(t0)).getUTCDay()];
  return `<div class="card today2"><h2>오늘 ${md(t0)} (${dw}) <span class="small" style="float:right">끝냄 ${h.tasks_done_today}</span></h2>${askedHtml}${calNote}${body}${looseHtml}
    <div class="small mute" style="margin-top:8px;text-align:right" onclick="Native.openTodo ? Native.openTodo() : 0">새 할 일은 업무 기록에서 ›</div></div>`;
}
window.doneTask = (id, mine) => {
  if (!mine) { window.Native && Native.openTodo && Native.openTodo(); return; }
  const t = HOME.tasks.find(x => x.id === id);
  const s = sheet(`<h3>완료할까요?</h3><div>${esc(t ? t.title : '')}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="ghost" id="no">아니요</button><button id="yes">완료 +EXP</button></div>`);
  s.querySelector('#no').onclick = closeSheet;
  s.querySelector('#yes').onclick = () => save('rpg_task_done', {p_id: id}, '퀘스트 완료');
};

function sheet(html){
  document.querySelectorAll('.sheet').forEach(s => s.remove());
  const s = document.createElement('div'); s.className = 'sheet';
  s.innerHTML = `<div class="in">${html}</div>`;
  s.onclick = e => { if (e.target === s) s.remove(); };
  document.body.appendChild(s); return s;
}
const closeSheet = () => document.querySelectorAll('.sheet').forEach(s => s.remove());
async function save(fn, args, okMsg){
  try { const r = await rpc(fn, Object.assign({p_token: token()}, args));
    if (r && r.error) { toast(r.error); return r; }
    if (r && r.need) return r;
    closeSheet(); if (okMsg) toast(okMsg); await load(); return r;
  } catch(e) { toast('저장하지 못했어요. 인터넷을 확인해 주세요'); return null; }
}

// 🏠 집 = 건강 기록(일어났어요·잘게요). 하루 경계는 새벽 4시(건강 기록과 같음)
window.openHome = () => {
  const h = HOME.health;
  if (!h) return toast('건강 기록 계정이 이어져 있지 않아요');
  if (h.need) {
    const yb = h.need === 'bed_yesterday';
    const s = sheet(`<h3>🏠 일어났어요</h3>
      ${yb ? `<div class="small mute">어젯밤 몇 시에 잤어요?</div><input id="yb" type="time" value="23:00">` : ''}
      <div class="small mute" style="margin:8px 0">지금 컨디션은?</div>
      <div class="faces"><button data-c="1">😫</button><button data-c="2">😐</button><button data-c="3">😄</button></div>`);
    s.querySelectorAll('[data-c]').forEach(b => b.onclick = () =>
      save('rpg_wake', {p_condition: +b.dataset.c, p_yesterday_bed: yb ? s.querySelector('#yb').value : null}, '좋은 아침이에요'));
  } else if (!h.bed) {
    const s = sheet(`<h3>🏠 집</h3><div class="small mute">오늘 ${h.wake}에 일어났어요 ${FACE[h.condition]||''}</div>
      <button style="margin-top:14px" id="b">🌙 잘게요</button><div class="small mute" style="margin-top:8px">지금 시각으로 잠든 시각을 적어요</div>`);
    s.querySelector('#b').onclick = () => save('rpg_bed', {}, '잘 자요');
  } else sheet(`<h3>🏠 집</h3><div>오늘은 다 적었어요</div><div class="small mute" style="margin-top:6px">일어남 ${h.wake} · 잠 ${h.bed}</div>`);
};

// 👛 지갑 = 재정 기록(오늘 날짜로 한 줄). 자주 쓴 항목이 먼저
// 재정 기록 앱이 있으면 그 앱의 빠른 기록 창(재정 위젯과 같은 창)을 연다. 돌아오면 다시 불러와 +EXP. 없을 때만 아래 창
window.openWallet = () => {
  if (window.Native && Native.openWallet && Native.openWallet()) return;
  openWalletHere();
};
window.openWalletHere = () => {
  let kind = '지출', pick = null;
  const label = i => [i.middle, i.detail].filter(Boolean).join(' · ') + (i.area ? ' ('+i.area+')' : '');
  const bookName = id => (HOME.books.find(b => b.id === id) || {}).name || '';
  const s = sheet(`<h3>👛 지갑</h3>
    <div class="seg"><button data-k="지출" class="on">− 썼어요</button><button data-k="수입">+ 받았어요</button></div>
    <input id="amt" inputmode="numeric" placeholder="금액(원)">
    <div class="small mute">무엇에? (자주 쓴 것)</div><div class="chips" id="chips"></div>
    <select id="all"></select>
    <input id="memo" placeholder="메모(선택)">
    <div class="err" id="err"></div><button id="go">기록</button>`);
  const draw = () => {
    const list = HOME.items.filter(i => i.kind === kind);
    const top = [...list].sort((a,b) => b.n - a.n).filter(i => i.n > 0).slice(0, 8);
    s.querySelector('#chips').innerHTML = top.map(i => `<span class="chip${pick===i.id?' on':''}" data-i="${i.id}">${esc(label(i))}</span>`).join('') || '<span class="small mute">아직 없어요</span>';
    s.querySelectorAll('.chip').forEach(c => c.onclick = () => { pick = c.dataset.i; s.querySelector('#all').value = pick; draw(); });
    let html = '<option value="">전체 항목에서 고르기</option>', g = '';
    for (const i of list) { const k = bookName(i.book)+' · '+i.bucket; if (k !== g) { if (g) html += '</optgroup>'; html += `<optgroup label="${esc(k)}">`; g = k; }
      html += `<option value="${i.id}"${pick===i.id?' selected':''}>${esc(label(i))}</option>`; }
    s.querySelector('#all').innerHTML = html + (g ? '</optgroup>' : '');
  };
  s.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { kind = b.dataset.k; pick = null;
    s.querySelectorAll('[data-k]').forEach(x => x.className = x === b ? 'on' : ''); draw(); });
  s.querySelector('#all').onchange = e => { pick = e.target.value || null; draw(); };
  s.querySelector('#amt').oninput = e => { s.querySelector('#err').textContent = ''; };
  s.querySelector('#go').onclick = () => {
    const amt = parseInt(String(s.querySelector('#amt').value).replace(/[^0-9]/g,''), 10), err = s.querySelector('#err');
    if (!amt) { err.textContent = '금액을 넣어 주세요'; return; }
    if (!pick) { err.textContent = '무엇에 썼는지 골라 주세요'; return; }
    save('rpg_fin_add', {p_item: pick, p_amount: amt, p_memo: s.querySelector('#memo').value}, won(amt)+' 적었어요');
  };
  draw();
};

// 📜 퀘스트 = 업무 기록(내가 나에게 준 할 일 중 오늘까지인 것). 누르면 완료
window.openQuest = () => {
  const t = HOME.tasks;
  const s = sheet(`<h3>📜 오늘의 퀘스트</h3>
    ${t.length ? t.map(x => `<div class="task"><button class="ck" data-id="${x.id}" aria-label="완료"></button>
      <div class="tt">${x.important ? '⭐ ' : ''}${esc(x.title)}<div class="small mute">${x.company ? esc(x.company)+' · ' : ''}${x.due ? md(x.due)+'까지' : ''}</div></div></div>`).join('')
      : '<div class="mute">오늘까지인 내 할 일이 없어요</div>'}
    <div class="small mute" style="margin-top:8px">새 할 일 적기·요청받은 일은 업무 기록 앱에서</div>`);
  s.querySelectorAll('.ck').forEach(b => b.onclick = () => { b.style.background = 'var(--brand)'; save('rpg_task_done', {p_id: b.dataset.id}, '퀘스트 완료'); });
};

// ⛪ 아빠 집 = 영성 기록 앱을 연다(묵상·가정예배·일기는 그 앱에서. 대신 쓰지 않는다)
window.openFather = () => {
  const sp = HOME.spirit_today || [];
  const s = sheet(`<h3>⛪ 아빠 집</h3>
    <div class="small">${['묵상','감사','칭찬','SOC','일기'].map(k => (sp.includes(k) ? '✓ ' : '· ') + k).join('<br>')}</div>
    <button style="margin-top:14px" id="go">영성 기록 열기</button>
    <div class="small mute" style="margin-top:8px">적고 돌아오면 여기에 바로 쌓여요</div>`);
  s.querySelector('#go').onclick = () => { closeSheet();
    if (window.Native && Native.openApp) Native.openApp('app.personalrecord', 'https://personal-record-alpha.vercel.app');
    else open('https://personal-record-alpha.vercel.app'); };
};
window.onNative = ev => { if (ev === 'resume') load(); };
let y0 = null; // 아래로 당기면 새로고침
addEventListener('touchstart', e => { y0 = scrollY === 0 ? e.touches[0].clientY : null; }, {passive:true});
addEventListener('touchend', e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 90) { toast('새로 불러와요'); load(); } y0 = null; });
load();
</script>
</body>
